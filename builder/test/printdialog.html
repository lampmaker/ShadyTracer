<!doctype html>
<html><head><meta charset="utf-8"><title>print dialog check</title></head>
<body style="background:#222">
<button id="anchor">anchor</button>
<script type="module">
/* THE PRINT DIALOG over a stand-in page (printdialog.check.mjs): a scene of two boxes and a light, the measured boxes
   by hand (each in its own frame, as boxes.js gives them), and the export recorded rather than run */
import * as M from '../model.js'
import { openPrintDialog, close, isOpen } from '../printdialog.js'
const T = (pos = [0, 0, 0], rot = [0, 0, 0]) => ({ pos: { x: pos[0], y: pos[1], z: pos[2] }, rot: { x: rot[0], y: rot[1], z: rot[2] }, scale: 1 })
const doc = M.createDoc({ title: 'print' }); doc.unit = 'mm'
M.addObject(doc, 'root', { id: 'a', primitive: 'box', label: 'part', transform: T([10, 0, 0], [0, 0, 90]) })
M.addObject(doc, 'root', { id: 'b', primitive: 'sphere', transform: T([-10, 0, 0]) })
M.addLight(doc, 'root', { id: 'lamp', shape: 'disc', transform: T([0, 0, 50]) })
const own = { a: { lo: [-2, -1, -3], hi: [2, 1, 3] }, b: { lo: [-1, -1, -1], hi: [1, 1, 1] }, lamp: { lo: [-1, -1, 0], hi: [1, 1, 0] } }
const T_ = { outline: [], exports: [] }
const boxes = { get: id => own[id] ?? null, request: () => { } }
const open = selected => openPrintDialog({
    doc: () => doc, selected, boxes, estimate: () => null,
    // the overlay asks its function every frame: kept, and asked when the check looks
    outline: get => { T_.get = get; T_.outline.push(get ? get() : null) },
    onExport: async (o, say) => { T_.exports.push(structuredClone(o)); say('meshing'); return { triangles: 1234, bytes: new Uint8Array(2 * 1048576), palette: [[1, 0, 0]], open: 0 } },
})
window.CHECK = { M, doc, T: T_, open, close, isOpen }
</script>
</body></html>
