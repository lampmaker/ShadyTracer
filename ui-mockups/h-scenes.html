<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H · Scenes and menus</title>
<!-- H: SCENES, PROJECTS AND THE MENUS (proposed 2026-10-17, roadmap/UI_PLAN.md section 11). The user: the File menu
     gives no overview of a project's scenes, and the Render settings menu says again what the view's icons and the
     Render settings pane already do. Today's menus as the code has them (builder/filemenu.js, index.html,
     lib/shell/shell.js), and four ways to see the scenes over one floor every option shares, on one made-up
     project. ONE FILE, nothing imported or fetched, so it renders on its own; the look is mock.css's tokens.
     Nothing here is used by the application. The pictures are sketches, not renders. -->
<style>
:root {
    color-scheme: dark;
    --bg: #0f1214; --panel: #16191c; --raised: #1d2226; --tabs: #13171a; --line: #2a3138;
    --ink: #dde3e8; --muted: #8fa3b3; --faint: #5d6b77;
    --accent: #7896af; --accent-bg: rgba(120, 150, 175, 0.22); --strong: #2f5d86;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70;
    --good: #3fae6a; --warn: #d9a226; --bad: #d9534f;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.4 var(--sans); overflow: hidden; }
button { font: inherit; color: inherit; background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 3px 9px; cursor: pointer; }
button:hover { background: var(--accent-bg); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.on { background: var(--accent-bg); border-color: rgba(160, 175, 190, 0.35); color: #fff; }
button.primary { background: var(--strong); border-color: #3b6f9c; color: #fff; }
button:disabled { opacity: 0.4; cursor: default; background: none; }
input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 2px 5px; min-width: 0; }
[hidden] { display: none !important; }
.app { display: flex; flex-direction: column; height: 100%; }

/* THE BANNER: which proposal, the scenario, the menu bar's row count */
.banner { display: flex; align-items: center; gap: 10px; padding: 5px 10px; background: #243240; color: #cfe0ee; font-size: 12px;
          border-bottom: 1px solid #34506a; flex-wrap: wrap; flex: none; }
.banner b { color: #fff; }
.banner a { color: #9fc6ea; }
.seg { display: inline-flex; border: 1px solid #34506a; border-radius: 5px; overflow: hidden; }
.seg button { border-radius: 0; border: 0; border-right: 1px solid #34506a; padding: 3px 10px; color: #cfe0ee; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: #2f5d86; color: #fff; }
.seg button .l { font: 600 11px var(--mono); color: #9fc6ea; margin-right: 4px; }
.seg button.on .l { color: #fff; }
.scen { display: inline-flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.scen button { font-size: 11.5px; padding: 1px 7px; border: 1px solid #34506a; color: #cfe0ee; }
.scen button.on { background: #3a2f12; border-color: #6b5a2c; color: #f3dfa6; }
.count { font: 11.5px var(--mono); color: #cfe0ee; margin-left: auto; }
.count b { color: #fff; }

/* THE NOTES under the banner: what to try, and why */
.notes { background: #171d22; border-bottom: 1px solid var(--line); padding: 6px 12px; font-size: 12px; flex: none; max-height: 30vh; overflow: auto; }
.notes .head { display: flex; gap: 10px; align-items: baseline; }
.notes .head .what { color: #c5ced6; }
.notes .head button { margin-left: auto; font-size: 11.5px; color: var(--muted); }
.notes .cols { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 18px; margin-top: 6px; }
.notes h4 { margin: 0 0 2px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: normal; }
.notes ul { margin: 0; padding-left: 16px; color: #c5ced6; }
.notes li { margin: 1px 0; }
.notes .pro li::marker { content: "+  "; color: var(--good); }
.notes .con li::marker { content: "−  "; color: var(--bad); }
.notes .ans li { margin-bottom: 3px; }
.notes kbd, kbd.k { font: 11px var(--mono); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; color: var(--muted); }

/* THE MENU BAR, the shell's */
.menubar { display: flex; align-items: center; height: 28px; padding: 0 6px; background: var(--raised); border-bottom: 1px solid var(--line); flex: none; }
.menubar .mb { padding: 2px 10px; cursor: default; }
.menubar .mb.on { background: var(--accent-bg); color: #fff; }
.menubar .mb.gone { color: #e6c877; }
.menubar .spacer { flex: 1; }
.menubar .layouts { display: flex; gap: 2px; }
.menubar .layouts button { font-size: 12px; padding: 1px 8px; color: var(--muted); }
.menubar .layouts button.on { color: #fff; background: var(--accent-bg); }
.menubar .title { color: var(--faint); font-size: 12px; margin-left: 12px; }
.menubar .mbtools { display: flex; gap: 1px; margin-left: 6px; padding-left: 6px; border-left: 1px solid var(--line); }
.menubar .mbtools button { padding: 0 7px; color: var(--muted); font-size: 14px; }
.menubar .mbtools button:not(:disabled):hover { color: #fff; }

/* A MENU, a submenu, a context menu: the shell's popup (lib/shell/menu.js) */
.pop { position: fixed; z-index: 100; min-width: 230px; max-width: 460px; background: #20262b; border: 1px solid #36404a; border-radius: 5px;
       padding: 4px 0; box-shadow: 0 8px 24px rgba(0,0,0,0.5); font-size: 12.5px; max-height: calc(100vh - 20px); overflow: auto; }
.pop .it { padding: 4px 14px 4px 12px; white-space: nowrap; display: flex; gap: 18px; align-items: center; cursor: default; position: relative; }
.pop .it:hover:not(.off), .pop .it.open { background: var(--accent-bg); }
.pop .it.off { color: var(--faint); }
.pop .it .kb { margin-left: auto; color: var(--faint); font: 11px var(--mono); }
.pop .it .ar { margin-left: auto; color: var(--faint); }
.pop .it.new::after { content: 'new'; font-size: 9.5px; color: #7fd1ae; border: 1px solid #2c6b54; border-radius: 6px; padding: 0 4px; margin-left: 6px; }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.pop .hd { color: var(--faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 12px 2px; }

/* THE WORK AREA: left column, the view, right column (Design's layout, index.html:253-263) */
.work { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(0, 1fr) 260px; position: relative; }
.colL, .colR { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.colL { border-right: 1px solid var(--line); }
.colR { border-left: 1px solid var(--line); }
.tabs { display: flex; height: 28px; background: var(--tabs); border-bottom: 1px solid var(--line); flex: none; }
.tabs span { padding: 5px 12px; color: var(--muted); font-size: 12px; border-right: 1px solid var(--line); }
.tabs span.on { background: var(--panel); color: #fff; box-shadow: inset 0 2px 0 var(--accent); }
.tabs .tabbtns { margin-left: auto; color: var(--faint); padding: 5px 8px; font-size: 12px; letter-spacing: 3px; }
.pane { overflow: auto; min-height: 0; }
.pane.tree { flex: 1.25; }
.pane.props { flex: 1; border-top: 1px solid var(--line); }
.hline { height: 1px; background: var(--line); flex: none; }

/* the row over the tree (builder/projectrow.js) */
.projrow { display: flex; align-items: center; gap: 4px; padding: 4px 6px; border-bottom: 1px solid var(--line); flex: none; min-height: 32px; }
.projrow .name { font-weight: 600; padding: 2px 6px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.projrow button.name { border: 1px solid transparent; display: flex; gap: 6px; align-items: center; }
.projrow button.name:hover { border-color: rgba(160,175,190,0.35); }
.projrow .note { color: var(--warn); font-weight: normal; font-size: 11.5px; }
.projrow .sp { flex: 1; }
.projrow .ic { padding: 2px 6px; color: var(--muted); }
.projrow .play { color: var(--good); }
.grid-ic { display: inline-grid; grid-template-columns: 5px 5px; gap: 2px; }
.grid-ic i { width: 5px; height: 5px; background: var(--muted); border-radius: 1px; }

/* THE TREE (builder/tree.js over TreeView) */
.rows { padding: 3px 2px; font-size: 12.5px; }
.r { display: flex; align-items: center; gap: 5px; padding: 1px 6px; border-radius: 3px; min-height: 22px; white-space: nowrap; cursor: default; position: relative; }
.r:hover { background: rgba(120,150,175,0.10); }
.r.sel { background: var(--accent-bg); color: #fff; }
.r .chev { width: 12px; color: var(--faint); font-size: 10px; text-align: center; cursor: pointer; flex: none; }
.r .ico { width: 14px; text-align: center; flex: none; font-size: 11px; }
.r .lab { overflow: hidden; text-overflow: ellipsis; }
.r .nt { color: var(--faint); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; }
.r .acts { margin-left: auto; display: flex; gap: 1px; flex: none; }
.r .acts span { padding: 0 4px; color: var(--muted); border-radius: 3px; cursor: pointer; }
.r .acts span:hover { background: var(--accent-bg); color: #fff; }
.r .acts .x { color: #e57373; }
.r .acts .go { color: var(--good); }
.r.dim .lab { color: var(--muted); }
.r.dim .ico { opacity: 0.6; }
.r.dim { min-height: 24px; }
.r.dim .acts { opacity: 0; }
.r.dim:hover .acts, .r.dim.sel .acts { opacity: 1; }
.r.drop { box-shadow: inset 0 0 0 1px var(--c3); background: rgba(25,158,112,0.15); }
.r.dropline { box-shadow: inset 0 2px 0 var(--c3); }
.r.curscene .lab { font-weight: 600; }
.r .pic { width: 30px; height: 19px; border-radius: 2px; overflow: hidden; flex: none; background: #0b0d0f; }
.r .pic svg { display: block; width: 100%; height: 100%; }
.ico.scene { color: #e6a356; } .ico.item { color: #7fd1ae; } .ico.group { color: #9fc6ea; } .ico.obj { color: #c5ced6; }
.ico.light { color: #f0d36e; } .ico.export { color: #c9a5e6; } .ico.haze { color: #a9b8c4; } .ico.mat { color: #d98c6e; }
.ico.back { color: var(--muted); }

/* C · THE SCENES STRIP over the tree */
.strip { border-bottom: 1px solid var(--line); flex: none; background: #14181b; }
.strip .sh { display: flex; align-items: center; gap: 6px; padding: 3px 6px 3px 8px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.strip .sh .chev { cursor: pointer; width: 12px; text-align: center; }
.strip .sh .sp { flex: 1; }
.strip .sh button { font-size: 13px; padding: 0 6px; color: #fff; text-transform: none; letter-spacing: 0; }
/* C′: the project's line and the Scenes header as one line (the user, 2026-10-17) */
.strip .sh.line { text-transform: none; letter-spacing: 0; font-size: 12.5px; color: var(--ink); padding: 4px 6px; min-height: 32px; gap: 4px; }
.strip .sh.line .pname { font-weight: 600; font-size: 12.5px; padding: 2px 6px; display: flex; gap: 6px; align-items: center; border: 1px solid transparent;
                         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.strip .sh.line .pname:hover { border-color: rgba(160,175,190,0.35); }
.strip .sh.line .cnt { color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.strip .sh.line .note { color: var(--warn); font-weight: normal; font-size: 11.5px; }
.strip .cards { display: flex; flex-direction: column; gap: 2px; padding: 2px 4px 6px; max-height: 196px; overflow: auto; }
.card-s { display: flex; gap: 7px; align-items: center; padding: 3px 5px; border-radius: 4px; border: 1px solid transparent; cursor: default; position: relative; }
.card-s:hover { background: rgba(120,150,175,0.10); }
.card-s.cur { border-color: #3b5268; background: #1c2731; box-shadow: inset 3px 0 0 var(--accent); }
.card-s.sel { background: var(--accent-bg); }
.card-s.drop { box-shadow: inset 0 0 0 1px var(--c3); background: rgba(25,158,112,0.15); }
.card-s.dropline { box-shadow: inset 0 2px 0 var(--c3); }
.card-s .pic { width: 52px; height: 33px; border-radius: 3px; overflow: hidden; flex: none; background: #0b0d0f; }
.card-s .pic svg { display: block; width: 100%; height: 100%; }
.card-s .tx { min-width: 0; flex: 1; }
.card-s .t { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-s .m { font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-s .acts { display: flex; gap: 1px; opacity: 0; }
.card-s:hover .acts, .card-s.sel .acts, .card-s.cur .acts { opacity: 1; }
.card-s .acts span { padding: 0 5px; color: var(--muted); border-radius: 3px; cursor: pointer; }
.card-s .acts span:hover { background: var(--accent-bg); color: #fff; }
.card-s .acts .go { color: var(--good); }
.badge { font-size: 10px; border: 1px solid #3b6f9c; color: #9fc6ea; border-radius: 7px; padding: 0 5px; white-space: nowrap; }
.badge.warn { border-color: #6b5a2c; color: #e6c877; }

/* B · THE QUICK LIST, a popover off the scene row */
.quick { position: fixed; z-index: 90; width: 330px; background: #1b2025; border: 1px solid #36404a; border-radius: 7px; box-shadow: 0 10px 30px rgba(0,0,0,0.55); }
.quick .qh { display: flex; align-items: center; padding: 7px 10px 4px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.quick .qh .sp { flex: 1; }
.quick .ql { max-height: 330px; overflow: auto; padding: 2px 5px; }
.quick .qf { display: flex; gap: 4px; padding: 6px 8px; border-top: 1px solid var(--line); }
.quick .qf button { font-size: 12px; }

/* PROPERTIES */
.ph { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 8px 10px 4px; display: flex; gap: 6px; align-items: center; }
.prop { display: grid; grid-template-columns: 38% 1fr; gap: 6px; align-items: center; padding: 2px 10px; min-height: 24px; font-size: 12.5px; }
.prop label { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prop input[type=text], .prop select { width: 100%; }
.pnote { font-size: 11.5px; color: var(--muted); padding: 4px 10px 8px; }
.pnote b { color: var(--ink); font-weight: 600; }
.scard { margin: 6px 10px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--raised); }
.scard .pic { height: 110px; background: #0b0d0f; }
.scard .pic svg { display: block; width: 100%; height: 100%; }
.scard .b { padding: 6px 9px 8px; }
.scard .t { font-weight: 600; }
.scard .m { color: var(--muted); font-size: 11.5px; }
.scard .btns { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.scard .btns button { font-size: 12px; border-color: var(--line); }

/* THE VIEW: a sketch where the picture would be, the renderer's buttons over it */
.view { position: relative; min-width: 0; min-height: 0; background: #0b0d0f; overflow: hidden; }
.view .picbig { position: absolute; inset: 0; }
.view .picbig svg { width: 100%; height: 100%; display: block; }
.view .vt { position: absolute; left: 8px; top: 8px; display: flex; gap: 3px; z-index: 2; }
.view .vt button { background: rgba(22,25,28,0.85); border: 1px solid rgba(160,175,190,0.25); font-size: 12px; padding: 2px 8px; }
.view .vt button.lit { color: #f0d36e; }
.view .an { position: absolute; right: 8px; bottom: 8px; z-index: 2; }
.view .an button { background: rgba(22,25,28,0.85); border: 1px solid rgba(160,175,190,0.25); font-size: 12px; }
.view .cap { position: absolute; left: 8px; bottom: 8px; font: 11px var(--mono); color: var(--muted); background: rgba(22,25,28,0.8); padding: 2px 8px; border-radius: 4px; z-index: 2; }
.view .itemstrip { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 3; display: flex; gap: 6px; align-items: center;
                   background: rgba(20,40,32,0.95); border: 1px solid #2c6b54; border-radius: 6px; padding: 3px 6px 3px 10px; font-size: 12px; }
.view .itemstrip button { font-size: 12px; border-color: #2c6b54; }
.busy { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 5; width: 300px; background: rgba(22,25,28,0.95);
        border: 1px solid rgba(160,175,190,0.3); border-radius: 7px; padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
.busy .t { font-size: 12.5px; margin-bottom: 6px; }
.busy .bar { height: 6px; background: #0b0d0f; border-radius: 3px; overflow: hidden; }
.busy .bar i { display: block; height: 100%; background: var(--accent); width: 0; }
.busy .l { font: 11px var(--mono); color: var(--muted); margin-top: 5px; display: flex; justify-content: space-between; }

/* RENDER SETTINGS, the pane in boxes (lib/pathtracer/settingsui.js RENDERER_BOXES) */
.box { margin: 8px; border: 1px solid #36404a; border-radius: 7px; background: #1a1e22; padding: 4px 0 6px; }
.box .bh { font-weight: 600; font-size: 12.5px; padding: 3px 10px 4px; }
.qbtns { display: flex; gap: 4px; padding: 2px 8px; flex-wrap: wrap; }
.qbtns .pill { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.qbtns .pill button { border: 0; border-radius: 0; font-size: 11.5px; padding: 2px 7px; }
.qbtns .pill button.on { background: var(--strong); color: #fff; }
.chk { display: flex; gap: 6px; align-items: center; padding: 2px 10px; font-size: 12px; color: #c5ced6; cursor: pointer; }
.chk input { margin: 0; }
.rnote { font-size: 11px; color: var(--faint); padding: 2px 10px; }

/* THE STATUS BAR */
.status { display: flex; gap: 16px; align-items: center; padding: 0 10px; height: 24px; background: #12304a; color: #cfe0ee; font: 11.5px var(--mono);
          flex: none; white-space: nowrap; overflow: hidden; }
.status .sp { flex: 1; }
.status .job { color: #f3dfa6; }
.status .saved { color: #9fe0c4; }
.status .saved.bad { color: #f3dfa6; }
.dlg .body { padding: 10px 14px; font-size: 12.5px; color: #c5ced6; }
.dlg .pick { display: flex; flex-direction: column; gap: 4px; padding: 6px 14px 4px; }
.dlg .pick button { text-align: left; border-color: var(--line); padding: 6px 10px; }
.dlg .pick button small { color: var(--muted); display: block; font-size: 11.5px; }

/* THE PROJECT VIEW: over the docked panels, not over the menu bar */
.pv { position: absolute; inset: 0; z-index: 20; background: #121619; display: grid; grid-template-columns: 250px minmax(0, 1fr); }
.pv .side { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.pv .side .sh { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; padding: 12px 12px 6px; }
.pv .plist { flex: 1; overflow: auto; padding: 0 6px; }
.pv .prow { padding: 6px 8px; border-radius: 5px; cursor: default; position: relative; }
.pv .prow:hover { background: rgba(120,150,175,0.10); }
.pv .prow.here { background: #1c2731; box-shadow: inset 3px 0 0 var(--accent); }
.pv .prow .n { font-weight: 600; font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
.pv .prow .m { font-size: 11px; color: var(--faint); }
.pv .prow .more { position: absolute; right: 6px; top: 6px; opacity: 0; padding: 0 5px; color: var(--muted); border-radius: 3px; }
.pv .prow:hover .more { opacity: 1; }
.pv .side .foot { display: flex; flex-direction: column; gap: 3px; padding: 8px; border-top: 1px solid var(--line); }
.pv .side .foot button { text-align: left; font-size: 12px; }
.pv .side .foot .where { font-size: 10.5px; color: var(--faint); padding: 2px 4px; }
.pv .main { overflow: auto; min-height: 0; padding: 14px 20px 30px; }
.pv .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pv .top h2 { margin: 0; font-size: 19px; }
.pv .top h2 input { font: inherit; font-weight: 600; background: transparent; border: 1px solid transparent; color: #fff; width: 280px; }
.pv .top h2 input:hover, .pv .top h2 input:focus { border-color: var(--line); }
.pv .top .m { color: var(--muted); font-size: 12px; }
.pv .top .sp { flex: 1; }
.pv .top button { border-color: var(--line); font-size: 12px; }
.pv h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: normal; margin: 18px 0 8px; display: flex; gap: 8px; align-items: baseline; }
.pv h3 .h3n { text-transform: none; letter-spacing: 0; color: var(--faint); font-size: 11.5px; }
.pv .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.card-v { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; overflow: hidden; cursor: pointer; position: relative; display: flex; flex-direction: column; }
.card-v:hover { border-color: #4b6178; }
.card-v.cur { border-color: #3b6f9c; box-shadow: 0 0 0 1px #3b6f9c; }
.card-v.off { opacity: 0.5; cursor: default; }
.card-v.dropline { box-shadow: -3px 0 0 var(--c3); }
.card-v .pic { aspect-ratio: 16 / 10; background: #0b0d0f; position: relative; }
.card-v .pic svg { display: block; width: 100%; height: 100%; }

.card-v .b { padding: 6px 9px 8px; }
.card-v .t { font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.pv .exgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.pv .aud { font-size: 13px; color: #fff; margin: 12px 0 4px; }
.pv .grp { font-size: 11px; color: var(--faint); margin: 8px 0 4px; }
.pv .welcome { margin-top: 12px; padding: 10px 12px; border: 1px solid #6b5a2c; background: #221b14; border-radius: 6px; color: #f3dfa6; font-size: 12.5px; }
.pv .blocked { margin-top: 12px; padding: 8px 12px; border: 1px solid #2c6b54; background: #14221c; border-radius: 6px; color: #9fe0c4; font-size: 12.5px; }

/* TODAY's Projects dialog (workspace/dialog.js) */
.modal { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,0.5); display: grid; place-items: center; }
.dlg { width: 560px; max-width: calc(100vw - 32px); background: #1b2025; border: 1px solid #36404a; border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
.dlg .dh { display: flex; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 600; }
.dlg .dh .sp { flex: 1; }
.dlg .dr { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 8px 14px; border-bottom: 1px solid #22292f; }
.dlg .dr .n { font-weight: 600; }
.dlg .dr .m { font-size: 11.5px; color: var(--muted); grid-column: 1; }
.dlg .dr .bs { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 2px; align-items: center; }
.dlg .dr .bs button { font-size: 11.5px; padding: 2px 6px; border-color: var(--line); }
.dlg .df { display: flex; gap: 6px; padding: 10px 14px; align-items: center; }
.dlg .df .where { font-size: 11px; color: var(--faint); margin-left: auto; max-width: 220px; }

/* CTRL K */
.pal { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); z-index: 120; width: 520px; max-width: calc(100vw - 32px);
       background: #1b2025; border: 1px solid #36404a; border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
.pal input { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 10px 14px; font-size: 14px; border-radius: 8px 8px 0 0; }
.pal .pl { max-height: 360px; overflow: auto; padding: 4px 0; }
.pal .pi { display: flex; gap: 10px; padding: 4px 14px; font-size: 12.5px; cursor: default; }
.pal .pi:hover, .pal .pi.on { background: var(--accent-bg); }

.mbox { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 0; }
.mbox .mh { display: flex; padding: 2px 12px 6px; font-weight: 600; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.mbox .mh span { margin-left: auto; font: 11px var(--mono); color: var(--muted); font-weight: normal; }
.mbox.gone .mh { color: #e6c877; }
.mbox .mr { padding: 2px 12px; font-size: 12px; display: flex; gap: 8px; }

table.w { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 6px; }

table.w th { background: var(--raised); color: var(--muted); font-weight: normal; }
table.w td:first-child { color: var(--ink); }

@media (max-width: 1100px) {
    .work { grid-template-columns: 270px minmax(0, 1fr); }
    .colR { display: none; }
    .notes .cols { grid-template-columns: 1fr; gap: 6px; }
}
@media (max-width: 760px) {
    /* a phone: the page scrolls, and the work area is given a height of its own rather than squeezed under the notes */
    body { overflow: auto; }
    .app { height: auto; min-height: 100%; }
    .notes { max-height: none; }
    .menubar { overflow-x: auto; }

<body>
<div class="app">
    <div class="banner" id="banner"></div>
    <div class="notes" id="notes"></div>
    <div class="menubar" id="menubar"></div>
    <div class="work" id="work"></div>
    <div class="page" id="page" hidden></div>
    <div class="status" id="status"></div>
</div>
<div id="layer"></div>
<script>
'use strict';
/*======================================================================================================================
  THE DATA: one made-up project, "Lamp study", its scenes and their trees; the other projects in this browser; the
  real examples (scenes/examples.js, titles and lines copied 2026-10-17).
======================================================================================================================*/
const EXAMPLES = [["First steps","Modelling and rendering","Start","Shapes on a table in daylight: one glass, two blended into one"],["Shape gallery","Modelling and rendering","Shapes","Every built-in shape, about 50 mm across"],["Combining shapes","Modelling and rendering","Shapes","Union, subtract and intersect, sharp and blended; a die made the way a die is"],["Modifiers","Modelling and rendering","Shapes","Twist, bend, repeat, mirror, round, shell, displace and relief, each on a plain shape"],["From points","Modelling and rendering","Shapes","An extruded star, a turned wine glass, a pipe along a path, a swept bar"],["Parametric part","Modelling and rendering","Shapes","A heatsink whose fin count, pitch and height are its parameters"],["Infinite detail","Modelling and rendering","Shapes","A Menger sponge four levels deep, and columns repeated to the horizon"],["Material board","Modelling and rendering","Materials","The library's materials on 40 mm spheres"],["Relief and texture","Modelling and rendering","Materials","Plaster, stucco, render, stone, hammered metal, leather: reliefs in a raking light"],["Glass and liquid","Modelling and rendering","Materials","A tumbler of water, a green bottle, a flint prism in the sun"],["Lighting a room","Modelling and rendering","Light and camera","A room in metres: daylight through a window and a 1500 lm lamp"],["Depth of field","Modelling and rendering","Light and camera","A row of pawns through an open lens, focused on the third"],["Animation","Modelling and rendering","Light and camera","Values marked animated, for the Timeline"],["Product shot","Modelling and rendering","Light and camera","A perfume bottle on a plinth in studio light"],["LED, lens and screen","Optical design","Optical design","An LED, a PMMA lens and a detector: illuminance in lux"],["Beam in dusty air","Optical design","Optical design","An LED's beam through a lens, seen in dust; a PMMA block in it stays clear"],["Aspheric condenser","Optical design","Optical design","An aspheric lens collimating a small source"],["Fresnel or plano-convex","Optical design","Optical design","One focal length made two ways, side by side"],["Parabolic reflector","Optical design","Optical design","A torch's reflector: the far field, intensity and beam angle"],["Light guide","Optical design","Optical design","Light carried round two bends by total internal reflection"],["RGBW colour mixing","Optical design","Optical design","Four LEDs and a mixing rod: the colour map"],["Dispersion in a prism","Optical design","Optical design","White light split by a flint prism at minimum deviation"],["Dichroic combiner","Optical design","Optical design","Red and blue beams joined by a coated plate"],["Office lighting","Optical design","Optical design","Four LED panels and the work plane's illuminance"]]
    .map(([title, audience, group, description]) => ({ title, audience, group, description }));

// a node: [label, kind, note, children]; kinds: group obj light export haze
const N = (l, k, n = '', c = null) => ({ l, k, n, c });
const TREES = {
    lens: () => [N('LED', 'light', '1 W, Lambertian'), N('Lens', 'group', 'a − b', [N('body', 'obj', '· PMMA'), N('bore', 'obj', '−')]),
                 N('Holder', 'obj', '· Aluminium'), N('Screen', 'obj', '· detector'), N('Floor', 'obj', '· White matte')],
    lens2: () => [N('LED', 'light', '1 W, Lambertian'), N('Asphere', 'obj', '· PMMA, k −0.6'), N('Holder', 'obj', '· Aluminium'),
                  N('Screen', 'obj', '· detector'), N('Floor', 'obj', '· White matte')],
    fresnel: () => [N('LED', 'light', '1 W'), N('Fresnel lens', 'obj', '· PMMA'), N('Plano-convex', 'obj', '· PMMA'),
                    N('Screen', 'obj', '· detector'), N('Floor', 'obj', '· White matte')],
    housing: () => [N('Housing', 'group', 'a ∪ b (smooth)', [N('shell', 'obj', '· Aluminium'), N('fins', 'obj', '× 12 · Aluminium')]),
                    N('Cover glass', 'obj', '· Glass'), N('Print box', 'export', '3MF / STL'), N('Floor', 'obj', '· Grey')],
    room: () => [N('Room', 'group', 'a − b', [N('walls', 'obj', '· Plaster'), N('window', 'obj', '−')]), N('Desk', 'obj', '· Oak'),
                 N('Luminaire', 'light', '× 4, 3600 lm'), N('Work plane', 'obj', '· detector'), N('Dust', 'haze', 'haze')],
    product: () => [N('Plinth', 'obj', '· White matte'), N('Bottle', 'group', 'a ∪ b ∪ c', [N('glass', 'obj', '· Glass'), N('perfume', 'obj', '· Liquid'), N('cap', 'obj', '· Brass')]),
                    N('Key light', 'light', 'softbox'), N('Fill light', 'light', 'softbox')],
    item: () => [N('Knob', 'obj', '· Brass'), N('Studio floor', 'obj', '· White matte')],
    empty: () => [],
    example: () => [N('(the example\'s objects)', 'group', '', [N('…', 'obj', '')])],
    file: () => [N('Bench', 'obj', '· Steel'), N('Test lamp', 'light', '500 lm')],
};
const MATS = { lens: ['PMMA', 'Aluminium', 'White matte'], lens2: ['PMMA', 'Aluminium', 'White matte'], fresnel: ['PMMA', 'White matte'],
               housing: ['Aluminium', 'Glass', 'Grey'], room: ['Plaster', 'Oak', 'White matte'], product: ['White matte', 'Glass', 'Liquid', 'Brass'],
               item: ['Brass', 'White matte'], empty: ['Default'], example: ['Default'], file: ['Steel'] };
const BASE = [
    { title: 'Spot lens v1', kind: 'lens', unit: 'mm', edited: '2 days ago', last: 6.2 },
    { title: 'Spot lens v2 (asphere)', kind: 'lens2', unit: 'mm', edited: '1 h ago', last: 9.4 },
    { title: 'Fresnel variant', kind: 'fresnel', unit: 'mm', edited: 'yesterday', predicted: 11, nopic: true },
    { title: 'Housing and heatsink', kind: 'housing', unit: 'mm', edited: '4 days ago', last: 12.6 },
    { title: 'Office with luminaire', kind: 'room', unit: 'm', edited: '5 days ago', last: 14.8 },
    { title: 'Product shot', kind: 'product', unit: 'cm', edited: '3 days ago', last: 7.1 },
];
const OTHER_PROJECTS = [
    { name: 'Desk lamp', when: '2 days ago', titles: ['Arm', 'Shade', 'On the desk'] },
    { name: 'Optics course', when: 'yesterday', titles: ['Week 1', 'Week 2', 'Week 3', 'Prism', 'Mirror'], other: true },
    { name: 'Old tests', when: '3 weeks ago', titles: ['Bench', 'Glass 1', 'Glass 2', 'Room', 'Haze', 'Menger', 'Spheres', 'Lens', 'Text'] },
];

let KEY = 0;
const mkScene = (o) => {
    const key = 's' + (++KEY);
    let id = 0;
    const ids = list => list.map(n => ({ ...n, id: `${key}:${++id}`, c: n.c ? ids(n.c) : null }));
    return { key, title: o.title, kind: o.kind, unit: o.unit || 'mm', edited: o.edited || 'just now', last: o.last ?? null,
             predicted: o.predicted ?? (o.last ? null : 6 + (KEY % 5)), nopic: !!o.nopic, hue: o.hue ?? (KEY * 47) % 360,
             tree: ids((TREES[o.kind] || TREES.empty)()), mats: [...(MATS[o.kind] || ['Default'])], nextId: 100 };
};
const countOf = s => { let o = 0, l = 0; const walk = list => list.forEach(n => { if (n.k === 'light') l++; else if (n.k !== 'group') o++; if (n.c) walk(n.c) }); walk(s.tree); return { o, l } };
const meta = s => { const { o, l } = countOf(s); return `${s.unit} · ${o} object${o === 1 ? '' : 's'} · ${l} light${l === 1 ? '' : 's'}` };
const secs = s => s.last != null ? s.last : (s.predicted || 8);
const timeNote = s => s.last != null ? `opened in ${Math.round(s.last)} s last time` : `about ${s.predicted} s (predicted)`;

/*======================================================================================================================
  THE STATE, and the scenarios the banner toggles
======================================================================================================================*/
const S = {
    route: 'today', scenes: [], current: null, shown: null, sel: null, folded: new Set(),
    sc: { many: false, item: false, copy: false, first: false, notCompiled: false, nostore: false, real: false }, imp: null,
    compiling: null, history: [], quality: 'draft', moveFast: true, lampsOnly: false, lightRays: true, lt: true,
    view: false, viewAt: null, dialog: false, notesOpen: true, stripFolded: false, pinFirst: false, msg: '', layout: 'Design',
};
function resetProject() {
    KEY = 0;
    if (S.sc.first) {
        S.scenes = [mkScene({ title: 'First steps', kind: 'product', unit: 'mm', edited: 'just now', last: 5.4 })];
    } else {
        S.scenes = BASE.map(mkScene);
        if (S.sc.many) for (let i = 7; i <= 20; i++)
            S.scenes.push(mkScene({ title: `Lens variant ${String(i).padStart(2, '0')}`, kind: i % 3 ? 'lens2' : 'fresnel', edited: `${i} days ago`, last: 8 + (i % 6) }));
    }
    S.current = S.shown = S.scenes[Math.min(1, S.scenes.length - 1)].key;
    S.item = S.sc.item ? mkScene({ title: 'Brass knob', kind: 'item', unit: 'mm', last: 3.1 }) : null;
    S.sel = { t: 'scene', key: S.current };
    S.history = [];
    S.folded.clear();
}
const PROJECT = () => S.sc.first ? 'My project' : S.sc.copy ? 'Lamp study (copy)' : 'Lamp study';
const cur = () => S.scenes.find(s => s.key === S.current);
const byKey = k => S.scenes.find(s => s.key === k);
const idx = k => S.scenes.findIndex(s => s.key === k);
const PROPOSED = () => S.route !== 'today';
const CHOSEN = () => S.route === 'c2';      // C as the user chose it, 2026-10-17
const blocked = () => !!S.item;              // a library item is being edited: switching and adding wait (filemenu.js:18-20)
const say = m => { S.msg = m; renderStatus(); };

/*======================================================================================================================
  PICTURES: SVG sketches standing in for each scene's last picture. Not renders.
======================================================================================================================*/
function pic(s, big = false) {
    if (!s) return '';
    const k = s.kind, h = s.hue;
    const g = `<defs><linearGradient id="bg${s.key}${big ? 'b' : ''}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(${h},18%,${k === 'room' ? 30 : 16}%)"/>`
            + `<stop offset="1" stop-color="hsl(${h},12%,6%)"/></linearGradient></defs><rect width="160" height="100" fill="url(#bg${s.key}${big ? 'b' : ''})"/>`;
    const floor = `<path d="M0 72 L160 72 L160 100 L0 100Z" fill="hsl(${h},8%,22%)"/>`;
    let body = '';
    if (k === 'lens' || k === 'lens2' || k === 'fresnel') {
        body = floor + `<path d="M30 52 L118 36 L118 68 Z" fill="rgba(255,230,150,0.14)"/>`
             + `<rect x="22" y="47" width="10" height="10" rx="2" fill="#f0d36e"/>`
             + (k === 'fresnel' ? `<path d="M62 34 l5 4 l-5 4 l5 4 l-5 4 l5 4 l-5 4 l5 4 l-5 4 Z" fill="rgba(170,210,235,0.55)" stroke="#cfe8f5" stroke-width="0.6"/>`
                : `<ellipse cx="64" cy="52" rx="${k === 'lens2' ? 7 : 5}" ry="17" fill="rgba(170,210,235,0.45)" stroke="#cfe8f5" stroke-width="0.6"/>`)
             + `<rect x="118" y="30" width="5" height="44" fill="#d8dde2"/><ellipse cx="117.5" cy="52" rx="2" ry="${k === 'lens2' ? 5 : 9}" fill="#fff6c8"/>`;
    } else if (k === 'housing') {
        body = floor + `<rect x="40" y="40" width="80" height="30" rx="4" fill="#8e979e"/>`
             + Array.from({ length: 9 }, (_, i) => `<rect x="${46 + i * 8}" y="26" width="3" height="16" fill="#a9b2b8"/>`).join('')
             + `<rect x="46" y="62" width="68" height="5" fill="rgba(200,230,255,0.5)"/>`;
    } else if (k === 'room') {
        body = `<path d="M0 100 L40 70 L120 70 L160 100Z" fill="#6b5c4a"/><rect x="40" y="18" width="80" height="52" fill="#c9c2b6"/>`
             + `<rect x="92" y="28" width="20" height="26" fill="#fff9e0"/><path d="M92 54 L112 54 L130 100 L80 100Z" fill="rgba(255,250,220,0.18)"/>`
             + `<rect x="52" y="20" width="30" height="3" fill="#fff"/><rect x="50" y="56" width="34" height="4" fill="#7a5632"/>`;
    } else if (k === 'product') {
        body = `<rect x="56" y="62" width="48" height="38" fill="#e7e4df"/><rect x="66" y="30" width="28" height="32" rx="6" fill="rgba(210,190,240,0.55)" stroke="#efe6ff" stroke-width="0.8"/>`
             + `<rect x="72" y="40" width="16" height="20" rx="3" fill="rgba(180,120,220,0.5)"/><rect x="74" y="22" width="12" height="9" rx="2" fill="#c9a24a"/>`
             + `<circle cx="30" cy="20" r="14" fill="rgba(255,255,255,0.08)"/>`;
    } else if (k === 'item') {
        body = floor + `<circle cx="80" cy="54" r="16" fill="#c9a24a"/><circle cx="74" cy="48" r="5" fill="rgba(255,250,220,0.6)"/>`;
    } else if (k === 'example' || k === 'file') {
        body = floor + `<rect x="58" y="44" width="44" height="28" rx="3" fill="hsl(${h},30%,45%)"/><circle cx="80" cy="34" r="10" fill="hsl(${(h + 120) % 360},35%,55%)"/>`;
    } else {
        body = floor;
    }
    const tag = big ? '' : '';
    return `<svg viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${g}${body}${tag}</svg>`;
}

/*======================================================================================================================
  THE ROUTES: today, and the four everyday layers over the floor every proposal shares
======================================================================================================================*/
const ROUTES = [
    ['today', '', 'Today'], ['a', 'A', 'The view only'], ['b', 'B', 'A quick list'], ['c', 'C', 'A scenes strip'], ['c2', 'C′', 'Your choice'], ['d', 'D', 'The project in the tree'], ['menus', '', 'The menus, row by row'],
];
const NOTES = {
    today: {
        what: 'As it is in 0.62.4: the scenes are names in File › Switch to scene ▸; File has 19 rows; Render settings is a menu and a pane.',
        try: ['Open <b>File</b>: projects, scenes, the library item, three kinds of file and a picture, in 19 rows. The scenes appear only in <b>Switch to scene ▸</b>, as names.',
              '<b>Render settings › Quality: Sketch</b>: the view\'s <kbd>Draft ▾</kbd> and the pane on the right change too. Three places for one setting.',
              'Right-click an object in the tree: <b>Copy to / Move to</b> another scene.',
              '<b>File › Projects…</b> is a dialog of its own; <b>Examples ▸</b> is three levels deep.'],
        pro: ['Nothing new to learn', 'Switching is a deliberate choice (a compile)'],
        con: ['No overview: the scenes are names in a submenu', 'File mixes projects, scenes, files and a picture', 'Render settings and Window say again what the pane, the view and the panel headers do', 'Two rows say Ctrl S; "project" names two file formats'],
    },
    a: {
        what: 'The floor alone: File in 6 rows, no Render settings or Window menu, and a Project view (projects, scenes with pictures, examples) opened from the project\'s name or the ⇄ on the scene row.',
        try: ['Click the project\'s name over the tree (or ⇄ on the scene row): the <b>Project view</b> covers the panels, not the menu bar. <kbd>Esc</kbd> goes back.',
              'Click a scene card: it opens (a compile) and you are back at work. Drag cards to reorder; <b>⋯</b> duplicates, exports, deletes; <kbd>Ctrl Z</kbd> after a delete stays on this scene.',
              'Scroll down in the view: the examples, by audience, each with what it shows. A click adds a copy and opens it.',
              '<b>File</b>: 6 rows. <kbd>Ctrl K</kbd> "quality" still finds Quality: Sketch, which has no menu row any more.'],
        pro: ['The least to build: one view, which replaces the Projects dialog and Examples ▸', 'Pictures, compile times and the examples in one place', 'Nothing on screen while working'],
        con: ['Every switch is a round trip through the view', 'While working, the other scenes cannot be seen'],
    },
    b: {
        what: 'A + a quick list: ⇄ on the scene row opens the scenes, with a small picture each; a click opens one. "All scenes and projects…" for the view.',

/* A COMPILE (index.html busy card, compileprogress.js:129-140 compileFraction / compileLabel copied): the tree is the
   new scene at once; the picture is the old one until the build is done */
const EASE_AT = 0.9, EASE_TO = 0.99, EASE_TAU = 0.5;
const compileFraction = (e, x) => { if (!(x > 0)) return 0; const r = Math.max(0, e) / x; return r <= 1 ? EASE_AT * r : EASE_TO - (EASE_TO - EASE_AT) * Math.exp(-(r - 1) / EASE_TAU); };
const compileLabel = (e, x) => (!(x > 0) || e >= x) ? 'taking longer than usual' : `about ${Math.max(1, Math.ceil((x - e) / 1000))} s left`;
function compile(s, done) {
    const speed = S.sc.real ? 1 : 5;
    const expect = (s.last ?? s.predicted ?? 8) * 1000;
    const actual = (s.last ?? (s.predicted * 1.15)) * 1000;
    S.compiling = { key: s.key, title: s.title, t0: performance.now(), expect, actual, speed, done };
    render();
    const tick = () => {
        const c = S.compiling;
        if (!c) return;
        const el = (performance.now() - c.t0) * c.speed;
        const card = document.querySelector('.busy');
        if (card) {
            card.querySelector('.bar i').style.width = `${(compileFraction(el, c.expect) * 100).toFixed(1)}%`;
            card.querySelector('.l .left').textContent = compileLabel(el, c.expect);
            card.querySelector('.l .el').textContent = `${(el / 1000).toFixed(1)} s${c.speed > 1 ? ` (shown ×${c.speed})` : ''}`;
        }
        const job = document.querySelector('.status .job');
        if (job) job.textContent = `compiling ${c.title} · ${compileLabel(el, c.expect)}`;
        if (el >= c.actual) {
            const took = c.actual / 1000;
            const sc = byKey(c.key);
            if (sc) { sc.last = Math.round(took * 10) / 10; sc.nopic = false; }
            S.compiling = null;
            S.shown = c.key;
            S.sc.notCompiled = false;
            c.done?.();
            render();
            say(`${c.title}: compiled in ${took.toFixed(1)} s${c.speed > 1 ? ' (shown five times faster: "real speed" in the banner)' : ''}`);
            return;
        }
        requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
}

    const at = idx(key), s = byKey(key), wasCurrent = key === S.current;

    if (S.sel?.key === key) S.sel = null;
    if (wasCurrent) { const nx = S.scenes[Math.max(0, at - 1)]; S.current = nx.key; S.sel = { t: 'scene', key: nx.key }; compile(nx); }
    else { render(); say(`deleted '${s.title}': Ctrl Z brings it back${PROPOSED() ? ', and you stay here' : ''}`); }
}
function moveScene(key, to) {
    const from = idx(key);
    if (from < 0 || to < 0 || to >= S.scenes.length || from === to) return;
    const [s] = S.scenes.splice(from, 1);
    S.scenes.splice(to, 0, s);
    S.history.push({ label: `move scene '${s.title}'`, scene: key, undo: () => { const i = idx(key); const [x] = S.scenes.splice(i, 1); S.scenes.splice(from, 0, x); return key; } });

function undo() {

    const key = h.undo();

        // the scene worked on was the one undone (a new scene taken back): back to the one before, a compile
        const back = byKey(h.wasCurrent) || S.scenes[0];

        compile(back);
        return say(`undone: ${h.label} -- back on ${back.title} (a compile)`);
    }
    if (!PROPOSED() && key && byKey(key) && key !== S.current && !S.compiling) {

function findNode(list, id) { for (const n of list) { if (n.id === id) return n; if (n.c) { const r = findNode(n.c, id); if (r) return r; } } return null; }

function sendTo(id, toKey, move) {
    const from = cur(), to = byKey(toKey);
    if (!from || !to || to.key === from.key) return;
    const n = findNode(from.tree, id);
    if (!n) return;
    const clone = JSON.parse(JSON.stringify(n));
    const re = x => { x.id = `${to.key}:${++to.nextId}`; if (x.c) x.c.forEach(re); };
    re(clone);
    to.tree.push(clone);
    if (move) removeNode(from.tree, id);
    S.history.push({ label: `${move ? 'move' : 'copy'} ${n.l} to '${to.title}'`, scene: to.key, undo: () => { removeNode(to.tree, clone.id); if (move) from.tree.push(n); return null; } });
    if (move) { S.sel = { t: 'scene', key: S.current }; compile(from); }
    else render();
    say(`${move ? 'moved' : 'copied'} ${n.l} to ${to.title}: nothing compiled there${move ? '; this scene compiles without it' : ''}`);
}

function popMenu(items, x, y, depth = 0, anchor = null) {
    openMenus.slice(depth).forEach(m => m.remove());
    openMenus = openMenus.slice(0, depth);
    const el = document.createElement('div');
    el.className = 'pop';
    const list = typeof items === 'function' ? items() : items;
    list.forEach(it => {
        if (it.sep) { el.appendChild(document.createElement('hr')); return; }
        if (it.hd) { const h = document.createElement('div'); h.className = 'hd'; h.textContent = it.hd; el.appendChild(h); return; }
        const d = document.createElement('div');
        d.className = `it${it.off ? ' off' : ''}${it.cls ? ' ' + it.cls : ''}`;
        d.innerHTML = `<span>${esc(it.label)}</span>${it.items ? '<span class="ar">▸</span>' : it.keys ? `<span class="kb">${it.keys}</span>` : ''}`;
        if (it.title) d.title = it.title;
        if (it.items && !it.off) {
            d.addEventListener('mouseenter', () => { el.querySelectorAll('.it.open').forEach(o => o.classList.remove('open')); d.classList.add('open');
                const r = d.getBoundingClientRect(); popMenu(it.items, r.right - 2, r.top - 5, depth + 1, d); });
        } else {
            d.addEventListener('mouseenter', () => { el.querySelectorAll('.it.open').forEach(o => o.classList.remove('open')); openMenus.slice(depth + 1).forEach(m => m.remove()); openMenus = openMenus.slice(0, depth + 1); });
            if (!it.off) d.addEventListener('click', e => { e.stopPropagation(); closeAll(); if (it.run) it.run(); else say(`${it.label}: not in the mockup`); });
        }
        el.appendChild(d);
    });
    layer.appendChild(el);
    openMenus.push(el);
    const r = el.getBoundingClientRect();
    let left = x, top = y;
    if (left + r.width > innerWidth - 4) left = anchor ? anchor.getBoundingClientRect().left - r.width + 2 : innerWidth - r.width - 4;
    if (top + r.height > innerHeight - 4) top = Math.max(4, innerHeight - r.height - 4);
    el.style.left = `${Math.max(4, left)}px`; el.style.top = `${top}px`;
    return el;
}

/* CTRL K: every command, those with no menu row marked */
let palSel = 0;
function openPalette() {
    closeAll();
    const el = document.createElement('div');
    el.className = 'pal';
    el.innerHTML = `<input placeholder="Find a command, e.g. quality, scene, export…"><div class="pl"></div><div class="pf">The rows taken out of the menus are still here: they are marked <span style="color:#e6c877">no menu row</span>. Enter runs one, Esc closes.</div>`;
    layer.appendChild(el);
    openMenus.push(el);
    const all = [];
    const walk = (menu, items) => items.forEach(it => { if (it.sep || it.hd || it.items || it.off) return; all.push({ menu, label: it.label, keys: it.keys, run: it.run }); });
    menusNow().forEach(m => walk(m.name, m.items));
    if (PROPOSED()) all.push(...paletteOnly().map(c => ({ ...c, only: true })));
    const inp = el.querySelector('input'), pl = el.querySelector('.pl');
    const draw = () => {
        const q = inp.value.toLowerCase().split(/\s+/).filter(Boolean);
        const hits = all.filter(c => q.every(w => `${c.menu} ${c.label}`.toLowerCase().includes(w))).slice(0, 60);
        palSel = Math.min(palSel, Math.max(0, hits.length - 1));
        pl.innerHTML = hits.map((c, i) => `<div class="pi${i === palSel ? ' on' : ''}" data-i="${i}"><span class="mn">${esc(c.menu)}</span><span>${esc(c.label)}</span>${c.only ? '<span class="only">no menu row</span>' : c.keys ? `<span class="only" style="color:var(--faint)">${c.keys}</span>` : ''}</div>`).join('') || '<div class="pi" style="color:var(--faint)">nothing found</div>';
        pl.querySelectorAll('.pi[data-i]').forEach(d => d.onclick = () => { const c = hits[+d.dataset.i]; closeAll(); c.run ? c.run() : say(`${c.label}: not in the mockup`); });
        el._hits = hits;
    };
    inp.oninput = () => { palSel = 0; draw(); };
    inp.onkeydown = e => {
        if (e.key === 'ArrowDown') { palSel++; draw(); e.preventDefault(); }
        else if (e.key === 'ArrowUp') { palSel = Math.max(0, palSel - 1); draw(); e.preventDefault(); }
        else if (e.key === 'Enter') { const c = el._hits?.[palSel]; closeAll(); if (c) c.run ? c.run() : say(`${c.label}: not in the mockup`); }
        else if (e.key === 'Escape') closeAll();
    };
    draw();
    inp.focus();
}

/*======================================================================================================================
  EVENTS: one listener each, by data attributes
======================================================================================================================*/
document.addEventListener('click', e => {
    const t = e.target;
    if (t.classList?.contains('modal')) { S.dialog = false; S.imp = null; render(); return; }
    if (!t.closest('.pop') && !t.closest('.quick') && !t.closest('.pal') && !t.closest('[data-menu]')) closeAll();
    const route = t.closest('[data-route]');
    if (route) { location.hash = route.dataset.route; return; }
    const scen = t.closest('[data-scen]');
    if (scen) {
        const k = scen.dataset.scen;
        if (S.compiling && k !== 'real') return say('wait for the compile');
        S.sc[k] = !S.sc[k];
        if (k === 'first' && S.sc.first) S.sc.many = false;
        if (k === 'many' && S.sc.many) S.sc.first = false;
        if (['many', 'first', 'item'].includes(k)) resetProject();
        if (k === 'nostore') say(S.sc.nostore ? (PROPOSED() ? 'IndexedDB refused: the status bar says the work is not kept' : 'this browser refused storage: the work lasts this visit (File › Save to a file keeps it) -- today\'s words, naming a row that does not exist') : 'storage back');
        if (k === 'item' && !S.sc.item) S.item = null;
        render();
        return;
    }
    const mb = t.closest('[data-menu]');
    if (mb) {
        const wasOn = mb.classList.contains('on');
        closeAll();
        if (!wasOn) { mb.classList.add('on'); const r = mb.getBoundingClientRect(); popMenu(menusNow()[+mb.dataset.menu].items, r.left, r.bottom); }
        return;
    }
    const lay = t.closest('[data-layout]');
    if (lay) return setLayout(lay.dataset.layout);
    const q = t.closest('[data-q]');
    if (q) return setQuality(q.dataset.q);
    const fold = t.closest('[data-fold]');
    if (fold) { const k = fold.dataset.fold; S.folded.has(k) ? S.folded.delete(k) : S.folded.add(k); render(); return; }
    const act = t.closest('[data-act]');
    if (act) {
        const a = act.dataset.act, key = act.dataset.key;
        e.stopPropagation();
        const r = act.getBoundingClientRect();
        switch (a) {
            case 'notes': S.notesOpen = !S.notesOpen; render(); return;
            case 'view': closeAll(); return openView();
            case 'closeview': return closeView();
            case 'quick': return quickList(act);
            case 'newmenu': return newMenu(r.left, r.bottom);
            case 'smenu': return sceneMenu(key, r.left, r.bottom);
            case 'open': closeAll(); return openScene(key);
            case 'dupof': return newScene('dupOf', key);
            case 'del': return deleteScene(key);
            case 'exportscene': return say(`downloaded ${fileName(byKey(key).title)}.json: the scene alone`);
            case 'exportproject': return say(`downloaded ${fileName(PROJECT())}.json: every scene, their cameras and the render settings`);
            case 'undo': return undo();
            case 'play': S.sc.notCompiled = false; return compile(cur());
            case 'strip': S.stripFolded = !S.stripFolded; render(); return;
            case 'pin': S.pinFirst = !S.pinFirst; render(); return;
            case 'closeitem': return closeItem();
            case 'saveitem': return say('library item saved');
            case 'closedlg': S.dialog = false; render(); return;
            case 'imp-cancel': S.imp = null; render(); return;
            case 'imp-scene': S.imp = null; return newScene('file');
            case 'imp-project': S.imp = 'ask'; render(); return;
            case 'imp-new': S.imp = null; render(); return say('desk-lamp kept as a project of its own and opened (in the mockup, nothing is opened)');
            case 'imp-add': {
                S.imp = null;
                if (S.compiling) { render(); return say('a compile is on its way'); }
                const at = idx(S.current) + 1;
                ['On the desk', 'Shade', 'Arm'].forEach(t => S.scenes.splice(at, 0, mkScene({ title: uniq(t), kind: 'file', unit: 'mm', predicted: 6 })));
                const added = S.scenes.slice(at, at + 3);
                S.history.push({ label: 'import 3 scenes', scene: added[0].key, wasCurrent: S.current, undo: () => { S.scenes.splice(idx(added[0].key), 3); return null; } });
                S.current = added[0].key; S.sel = { t: 'scene', key: added[0].key };
                compile(added[0]);
                return say('Arm, Shade and On the desk added after the scene you were on; Arm opens');
            }
            case 'vquality': return popMenu([{ hd: 'Quality' }, ...['sketch', 'draft', 'standard', 'high', 'optics'].map(x => R(`${x === S.quality ? '● ' : '  '}${QSHORT[x]}`, { run: () => setQuality(x) })), SEP, { hd: 'While moving' }, R(`${S.moveFast ? '☑' : '☐'} Fast while moving, as Draft`, { run: () => { S.moveFast = !S.moveFast; render(); } })], r.left, r.bottom);
            case 'bolt': S.moveFast = !S.moveFast; render(); return say(`fast while moving: ${S.moveFast ? 'on' : 'off'}`);
            case 'newproject': return say('a new project of one empty scene, opened (Lamp study stays in the list)');
            case 'import': return say('Import a file…: a project file kept as a project of its own');
            case 'pmenu': return popMenu([R('Open'), R('Rename…'), R('Duplicate'), R('Export project file…'), SEP, R('Delete…', { off: +act.dataset.i === 0, title: 'The project open here cannot be deleted' })], r.left, r.bottom);
        }
        return;
    }
    const proj = t.closest('[data-proj]');
    if (proj) { if (+proj.dataset.proj === 0) return closeView(); return say('opening another project: this one is saved first, the other shown (its scenes, cameras, render settings) -- not in the mockup'); }
    const ex = t.closest('[data-example]');
    if (ex) { if (blocked()) return say('close the library item first'); return newScene('example', EXAMPLES[+ex.dataset.example]); }
    const vcard = t.closest('[data-vcard]');
    if (vcard) { if (blocked() && vcard.dataset.vcard !== S.current) return say('close the library item first'); return openScene(vcard.dataset.vcard); }
    const card = t.closest('[data-card]');
    if (card) {
        const k = card.dataset.card;
        if (card.closest('.quick')) { closeAll(); return openScene(k, { back: false }); }
        if (twice(`c:${k}`) && k !== S.current) return openScene(k, { back: false });
        S.sel = { t: 'scene', key: k }; render();
        if (k !== S.current) say(`${byKey(k).title} selected: its card in Properties; nothing compiled. ▶ or a double-click opens it`);
        return;
    }
    const row = t.closest('[data-row]');
    if (row) {
        if (row.dataset.node) S.sel = { t: 'node', id: row.dataset.node };
        else if (row.dataset.scene) {
            if (row.dataset.other && twice(`r:${row.dataset.scene}`)) return openScene(row.dataset.scene, { back: false });
            S.sel = { t: 'scene', key: row.dataset.scene }; if (row.dataset.other) say(`${byKey(row.dataset.scene).title} selected: its card in Properties; nothing compiled. ▶ or a double-click opens it`); }
        render();
    }
});
/* A DOUBLE CLICK counted here, as tree.js:606-630 counts one: the first click re-renders, so the second lands on a new element */
let lastClick = { k: null, t: 0 };
function twice(k) { const now = performance.now(), hit = lastClick.k === k && now - lastClick.t < 450; lastClick = hit ? { k: null, t: 0 } : { k, t: now }; return hit; }
document.getElementById('menubar').addEventListener('mouseover', e => {
    // a menu open: pointing at another one opens that one instead, as a menu bar does
    const mb = e.target.closest('[data-menu]');
    if (!mb || mb.classList.contains('on') || !document.querySelector('.menubar .mb.on')) return;
    closeAll(); mb.classList.add('on');
    const r = mb.getBoundingClientRect(); popMenu(menusNow()[+mb.dataset.menu].items, r.left, r.bottom);
});
document.addEventListener('contextmenu', e => {
    const t = e.target;
    const node = t.closest('[data-node]');
    if (node) { e.preventDefault(); return nodeMenu(node.dataset.node, e.clientX, e.clientY); }
    const sc = t.closest('[data-scene]') || t.closest('[data-card]') || t.closest('[data-vcard]');
    if (sc && PROPOSED()) { e.preventDefault(); return sceneMenu(sc.dataset.scene || sc.dataset.card || sc.dataset.vcard, e.clientX, e.clientY); }
});
document.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.rename) return renameScene(t.dataset.rename, t.value);
    if (t.dataset.t) { const k = t.dataset.t; S[k] = k === 'lampsOnly' ? !t.checked : t.checked; render(); }
});
document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return openPalette(); }
    if (e.target.matches('input, select')) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); return undo(); }
    // Ctrl S and Ctrl O as the page binds them (builder/toolbar.js:49-60), with or without a menu row
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        if (S.item) return say('library item saved: back into the library (Ctrl S, or Save on its strip)');
        return say(CHOSEN() ? 'saved -- it already was: the project is saved in this browser as it changes' : `saved in this browser: ${PROJECT()}`);
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') { e.preventDefault(); if (CHOSEN()) { S.imp = 'pick'; render(); } else newScene('file'); return; }
    if (e.key === 'Escape') { if (layer.children.length) return closeAll(); if (S.imp) { S.imp = null; return render(); } if (S.view) return closeView(); if (S.dialog) { S.dialog = false; render(); } }
});

/* DRAGS: a tree row onto a scene (C's card, D's row) copies it there, Shift moves it; scenes among scenes reorder */
let drag = null;
document.addEventListener('dragstart', e => {
    const n = e.target.closest?.('[data-node]'), sc = e.target.closest?.('[data-scene]'), c = e.target.closest?.('[data-card]'), v = e.target.closest?.('[data-vcard]');
    if (n) drag = { node: n.dataset.node };
    else if (sc) drag = { scene: sc.dataset.scene };
    else if (c) drag = { scene: c.dataset.card };
    else if (v) drag = { scene: v.dataset.vcard };
    else return;
    e.dataTransfer.effectAllowed = 'copyMove';
    try { e.dataTransfer.setData('text/plain', 'mock'); } catch { }
});
const dropTarget = t => t.closest?.('[data-card]') || t.closest?.('[data-vcard]') || t.closest?.('[data-scene]');
const keyOf = el => el.dataset.card || el.dataset.vcard || el.dataset.scene;
document.addEventListener('dragover', e => {
    if (!drag) return;
    const el = dropTarget(e.target);
    document.querySelectorAll('.drop, .dropline').forEach(x => x.classList.remove('drop', 'dropline'));
    if (!el) return;
    const k = keyOf(el);
    if (drag.node && k !== S.current && (S.route === 'c' || S.route === 'd') && !el.dataset.vcard) { e.preventDefault(); el.classList.add('drop'); e.dataTransfer.dropEffect = e.shiftKey ? 'move' : 'copy'; }
    else if (drag.scene && k !== drag.scene) { e.preventDefault(); el.classList.add('dropline'); }
});
document.addEventListener('drop', e => {
    if (!drag) return;
    e.preventDefault();
    const el = dropTarget(e.target);
    document.querySelectorAll('.drop, .dropline').forEach(x => x.classList.remove('drop', 'dropline'));
    if (el) {
        const k = keyOf(el);
        if (drag.node && k !== S.current) sendTo(drag.node, k, e.shiftKey);
        else if (drag.scene && k !== drag.scene) { const from = idx(drag.scene), tk = idx(k); moveScene(drag.scene, from < tk ? tk - 1 : tk); }   // before the scene dropped on
    }
    drag = null;
});
document.addEventListener('dragend', () => { drag = null; document.querySelectorAll('.drop, .dropline').forEach(x => x.classList.remove('drop', 'dropline')); });

function fromHash() {
    const h = location.hash.slice(1);
    S.route = ROUTES.some(r => r[0] === h) ? h : 'c2';
    S.view = false; S.dialog = false; S.imp = null;
    closeAll();
    render();
}
window.addEventListener('hashchange', fromHash);
resetProject();
fromHash();
say('a mockup on made-up data: menus, the scenes and the compile are simulated; the pictures are sketches');
</script>
</body>
</html>
