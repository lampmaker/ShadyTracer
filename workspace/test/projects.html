<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Projects, scenes and the File menu · check</title>
<!-- THE PROJECTS KEPT IN THE BROWSER, THE SCENES' CARDS, THE PROJECT PANEL AND THE FILE MENU, for
     workspace/test/projects.check.mjs: wired as the application's page wires them (index.html) -- the real store in
     IndexedDB, the tabs' locks, the autosave, the session; the real builder (builder/demo.js), tree, the line and cards
     over it (builder/scenestrip.js), the Project panel (workspace/projectview.js), Import's question (workspace/ask.js),
     File's commands (builder/filemenu.js, run as the menu bar would: lib/shell is checked on its own), library and item
     editor -- with a stand-in for the renderer alone: no GPU, so a compile is the stand-in's, and the renderer's settings
     are a camera and a few values. The scenes' pictures are kept in memory (workspace/scenepics.js memoryPics). -->
<link rel="stylesheet" href="../../lib/shell/shell.css">
<style>html, body { height: 100%; margin: 0; background: #16191c; } body { display: flex; }
#s { width: 360px; height: 760px; display: flex; flex-direction: column; } #t { flex: 1; overflow: auto; }
#v { position: relative; width: 300px; height: 760px; background: #111; overflow: hidden; }
#pv { width: 900px; height: 760px; }</style>
</head>
<body>
<div id="s" class="shell-panel"><div id="sw"></div><div id="t"></div></div><div id="v"></div><div id="pv" class="shell-panel"></div>
<script type="module">
import * as M from '../../builder/model.js'
import * as P from '../../builder/project.js'
import { installBuilder } from '../../builder/demo.js'
import { installBuilderTree } from '../../builder/tree.js'
import { installSceneStrip } from '../../builder/scenestrip.js'
import { fileCommands, sceneCommands } from '../../builder/filemenu.js'
import { createProjectStore, indexedDbProjects } from '../store.js'
import { createTabs } from '../tabs.js'
import { createAutosave, recoverAll } from '../autosave.js'
import { createSession } from '../session.js'
import { installProjectView } from '../projectview.js'
import { ask } from '../ask.js'
import { createScenePics, memoryPics } from '../scenepics.js'
import { createLibrary, indexedDbBackend } from '../../library/store.js'
import { installItemEditor } from '../../library/edit.js'

const T = { applied: [], said: [], downloads: [], nextFile: null, selected: [], files: [], cards: [], opened: [], work: 0, removed: [] }
const say = t => T.said.push(t)
// THE RENDERER, stood in: its settings are values and a camera; its view (0.66.0) the camera and the exposure, put back
// as the real one puts them back -- the camera only in the fields given (lib/pathtracer/index.js applyCamera)
const R = { values: { autoExposure: 0, exposure: 1 }, camera: { mode: 'orbit', azimuth: 40, elevation: 70, distance: 20 } }
const watchers = new Set(), told = () => watchers.forEach(f => f())
const RT = { scene: null,
    settings: () => ({ values: structuredClone(R.values), camera: structuredClone(R.camera), size: { mode: 'fit' } }),
    applySettings: ({ values = {}, camera } = {}) => { Object.assign(R.values, values); if (camera) Object.assign(R.camera, structuredClone(camera)); told(); return [] },
    view: () => ({ camera: structuredClone(R.camera), exposure: { autoExposure: R.values.autoExposure ?? 1 } }),
    applyView: ({ camera, exposure } = {}) => { if (camera) Object.assign(R.camera, structuredClone(camera)); if (exposure) Object.assign(R.values, exposure); told() },
    watchView: f => (watchers.add(f), () => watchers.delete(f)),
    set: v => { Object.assign(R.values, v); return [] }, get: () => structuredClone(R.values) }
const demo = () => {
    const d = P.blankScene('Builder demo')
    M.addObject(d, 'root', { primitive: 'sphere', label: 'Ball' })
    M.addObject(d, 'root', { primitive: 'box', label: 'Slab' })
    return d
}

const store = createProjectStore({ backend: indexedDbProjects('check.projects') })
let BUILDER = null, tree = null, E = null, strip = null, showProject = async () => { }
let local = null
try { local = localStorage } catch { }
const AUTOSAVE = createAutosave({ store, local, say,
    read: () => ({ revision: BUILDER.revision, project: BUILDER.project,
        session: { current: BUILDER.current, renderer: P.rendererSettings(RT.settings()), views: BUILDER.views(), item: E?.remember() ?? null } }),
    onCreated: m => SESSION.adopt(m) })
const SESSION = createSession({ store, tabs: createTabs(), autosave: AUTOSAVE, say,
    firstVisit: async () => P.createProject([demo()]), apply: (w, item) => showProject(w, item) })
await recoverAll(store, local)
const START = await SESSION.start()
BUILDER = installBuilder(window, { RT, gpu: null, project: START.workspace.project, current: START.workspace.current,
    onDoc: () => { tree?.rebuild(); E?.sync(); strip?.refresh() } })           // as the page's onDoc
/* NO GPU: a compile is the stand-in's -- the scene counts as shown, as the end of setScene makes it, and the item
   editor told, as the page's onScene tells it */
const shownText = () => ({ id: 'built', wgsl: BUILDER.generate().wgsl })
RT.scene = shownText()
BUILDER.apply = async () => { T.applied.push(BUILDER.current); BUILDER.markShown(); RT.scene = shownText(); E?.shown(); return { ok: true } }
tree = installBuilderTree(document.getElementById('t'), BUILDER, { onStatus: say, onSelect: id => T.selected.push(id),
    onItem: (what, key) => { if (BUILDER.current !== key) tree.enterScene(key); what === 'save' ? E.save() : E.close() } })
const library = createLibrary({ model: M, backend: indexedDbBackend('check.library') })
E = installItemEditor({ BUILDER, RT, SHELL: null, library, tree, stage: document.getElementById('v'), say })
const examples = { list: [{ id: 'menger.json', title: 'Menger cubes', audience: 'Modelling', group: 'Shapes', description: 'A sponge' },
                          { id: 'materials.json', title: 'Material test', audience: 'Modelling', group: 'Materials', description: 'Spheres' }],
    open: async f => { say(BUILDER.load(await (await fetch(`../../test/fixtures/scenes/${f}`)).text())); await tree.apply() } }
const pics = createScenePics({ backend: memoryPics() })
const picture = key => pics.get(SESSION.info().id, key)
const exportScene = key => T.files.push(`exportScene:${key}`)
/* IMPORT FROM FILE, as the page's openText does it (index.html): T.nextFile read -- a scene file joins this project; a
   project file asks (ask.js): a project of its own, or its scenes added here */
const importFile = async () => {
    T.files.push('import')
    const f = T.nextFile
    if (!f) return
    let kind = null
    try { kind = P.parse(f.text) } catch { }
    const many = kind?.workspace?.project ?? kind?.project
    if (many) {
        const n = many.scenes.length
        const how = await ask({ title: `${f.name} holds ${n} scenes`, text: '', choices: [
            { value: 'new', label: 'Open as a project of its own' }, { value: 'add', label: `Add its ${n} scenes to ${SESSION.info().name}` }] })
        if (how === 'new') { await SESSION.importText(f.text, f.name.replace(/\.json$/i, '')); return }
        if (how !== 'add') return
        say(BUILDER.load(kind.workspace ? P.serialize(many) : f.text)); await tree.apply(); return
    }
    say(BUILDER.load(f.text)); await tree.apply()
}
strip = installSceneStrip(document.getElementById('sw'), { BUILDER, ops: tree.sceneOps, tree, project: () => SESSION.info(), picture,
    onSelect: key => T.cards.push(key), openProject: s => T.opened.push(s ?? 'top'), item: () => E.active, compile: () => tree.apply(), exportScene, say })
const view = installProjectView(document.getElementById('pv'), { session: SESSION, BUILDER, ops: tree.sceneOps, picture, examples,
    importFile, exportProject: () => T.files.push('exportProject'), exportScene, download: (n, t) => T.downloads.push([n, t]), app: () => 'check',
    showWork: () => T.work++, item: () => E.active, onRemoved: id => T.removed.push(id), say })
view.visible(true)
/* THE FILE MENU'S COMMANDS, and the scenes' menu-less ones, as the page registers them (index.html), each file call recorded */
const commands = [...fileCommands({ item: { active: () => E.active },
    actions: { newProject: () => SESSION.create(), projects: () => T.opened.push('projects'), importFile,
               exportScene: () => exportScene(BUILDER.current), exportProject: () => T.files.push('exportProject'),
               exportPrint: () => T.files.push('exportPrint'), picture: () => T.files.push('picture') } }),
    ...sceneCommands({ BUILDER, ops: tree.sceneOps, item: { active: () => E.active }, say })]
/* RUN AS THE MENU BAR RUNS THEM (lib/shell/shell.js showMenu): a greyed row does nothing; a submenu's entry by label */
const cmd = id => commands.find(c => c.id === id)
const menu = {
    file: () => commands.filter(c => c.menu === 'File').map(c => c.label),
    on: id => { const c = cmd(id); try { return c.when ? c.when() !== false : true } catch { return false } },
    run: id => menu.on(id) ? cmd(id).run() : null,
    items: id => menu.on(id) ? cmd(id).items() : [],
    choose: (id, label) => { const x = menu.items(id).find(i => i.label === label); return x && !x.off ? x.run() : null },
}
showProject = async (w, item) => {
    BUILDER.replace({ project: w.project, current: w.current })
    tree.select(null)
    RT.applySettings(w.renderer || {})
    await E.adopt(item)
    strip.refresh()
    await tree.apply()
}
RT.applySettings(START.workspace.renderer || {})
await E.adopt(START.item)
AUTOSAVE.since()
setInterval(() => AUTOSAVE.tick(), 150)          // the page's is a second; a check waits less
window.addEventListener('pagehide', () => { AUTOSAVE.flush(); AUTOSAVE.tick() })
window.CHECK = { M, P, T, R, RT, BUILDER, tree, strip, view, menu, pics, importFile, SESSION, AUTOSAVE, E, library, store, START,
    rows: () => [...document.querySelectorAll('#t .treeview-node')].map(n => n.querySelector('.treeview-label')?.textContent.trim()) }
</script>
</body>
</html>
