<!DOCTYPE html>
<!-- EXAMPLE.HTML — the timeline library on a plain 2D canvas, no WebGPU, no other library.

     A scene (three discs) with a handful of properties. The sequencer panel underneath keyframes
     them, scrubs and plays them, and RECORD renders every frame with the chosen number of passes
     and writes an MP4 or a ZIP of PNGs. The integration is the block marked THE INTEGRATION:
     a registry of properties and one makeSequencer() call. Everything else here is the scene.

     Open it over http:// (any static server; file:// blocks module imports in most browsers).
     THIS SECTION GENERATED BY CLAUDE -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>timeline example</title>
    <link rel="stylesheet" href="./timeline.css">
    <style>
        html, body { margin: 0; height: 100%; background: #141414; color: #ccc; font-family: Arial, sans-serif; overflow: hidden; }
        .page { display: flex; flex-direction: column; height: 100vh; }
        .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
        canvas#scene { max-width: 100%; max-height: 100%; background: #202020; }
        .hint { position: absolute; left: 12px; top: 10px; font-size: 12px; color: #888; line-height: 1.5; }
        .hint b { color: #d6e1ff; }
        #panel { height: 230px; flex-shrink: 0; border-top: 1px solid #000; }
    </style>
</head>
<body>
    <div class="page">
        <div class="stage">
            <canvas id="scene" width="960" height="540"></canvas>
            <div class="hint">
                <b>timeline example</b> — three discs, six properties.<br>
                Pick a property from <b>+ track</b>, scrub, change the value in the panel or by
                keying (●) at another time, press ▶.<br>
                <b>⚙ export</b> then <b>RECORD</b> renders every frame with N passes and downloads the file.
            </div>
        </div>
        <div id="panel"></div>
    </div>
    <script type="module">
        import { makeRegistry } from './registry.js'
        import { makeSequencer } from './sequencer.js'

        // ===================================================================== the scene
        let canvas = document.querySelector('#scene')
        let ctx = canvas.getContext('2d')
        let S = { hue: 20, size: 60, pos: [480, 270], spread: 160, spin: 0, count: 3, style: 0 }
        let seed = 1, rnd = _ => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296

        // one PASS: the scene drawn once with a random sub-pixel offset and a sprinkle of grain.
        // Averaging N passes is what "renders per frame" means here -- the same idea as a path
        // tracer accumulating samples: one pass is grainy, sixteen are smooth.
        let pass = (w, h) => {
            let sc = w / 960
            ctx.save()
            ctx.translate((rnd() - 0.5) * 1.5 * sc, (rnd() - 0.5) * 1.5 * sc)
            ctx.scale(sc, sc)
            ctx.fillStyle = '#202020'; ctx.fillRect(-2, -2, 964, 544)
            let n = Math.max(1, Math.round(S.count))
            for (let i = 0; i < n; i++) {
                let a = S.spin * Math.PI / 180 + i / n * Math.PI * 2
                let x = S.pos[0] + Math.cos(a) * S.spread, y = S.pos[1] + Math.sin(a) * S.spread
                ctx.fillStyle = `hsl(${S.hue + i * 40}, 70%, 55%)`
                ctx.beginPath()
                if (S.style == 1) ctx.rect(x - S.size, y - S.size, S.size * 2, S.size * 2)
                else ctx.arc(x, y, S.size, 0, Math.PI * 2)
                ctx.fill()
            }
            ctx.fillStyle = 'rgba(255,255,255,0.5)'
            for (let i = 0; i < 400; i++) ctx.fillRect(rnd() * 960, rnd() * 540, 1.5, 1.5)
            ctx.restore()
        }
        // DRAW WITH N PASSES, averaged. Returns when the picture is complete (a real renderer
        // would await its GPU here); yields every few passes so the page stays responsive.
        let draw = async (samples = 1) => {
            let w = canvas.width, h = canvas.height
            let acc = new OffscreenCanvas(w, h), ax = acc.getContext('2d')
            for (let s = 0; s < samples; s++) {
                pass(w, h)
                ax.globalAlpha = 1 / (s + 1)          // running mean: each pass weighs 1/(n+1)
                ax.drawImage(canvas, 0, 0)
                if (s % 4 == 3) await new Promise(r => setTimeout(r, 0))
            }
            ctx.globalAlpha = 1
            ctx.drawImage(acc, 0, 0)
        }

        // ===================================================================== THE INTEGRATION
        let reg = makeRegistry()
        let prop = (id, label, min, max, extra = {}) => reg.add({ id, label, min, max, get: _ => S[id], set: v => { S[id] = v }, ...extra })
        prop('hue', 'hue °', 0, 360)
        prop('size', 'disc size', 5, 200)
        prop('spread', 'spread', 0, 400)
        prop('spin', 'spin °', -720, 720)
        prop('count', 'disc count', 1, 12, { step: 1 })                           // an integer
        prop('style', 'shape', 0, 1, { options: { disc: 0, square: 1 } })          // an enum: holds, never blends
        reg.add({ id: 'pos', label: 'centre x,y', dims: 2, min: 0, max: 960,       // two components in one track
            get: _ => S.pos, set: v => { S.pos = v } })

        let liveSize = [canvas.width, canvas.height]
        let seq = makeSequencer({
            host: document.querySelector('#panel'),
            registry: reg,
            onSeek: _ => draw(1),                          // the timeline moved: show that state
            render: samples => draw(samples),              // an export frame: N passes, then resolve
            grab: _ => canvas,                             // the finished frame
            begin: ({ width, height }) => { canvas.width = width; canvas.height = height },
            end: _ => { [canvas.width, canvas.height] = liveSize; draw(1) },
            storageKey: 'timeline-example.v1',
            defaults: { timeline: { fps: 30, duration: 6 }, export: { width: 1280, height: 720, samples: 8, filename: 'example' } },
        })
        // a starting animation, only when nothing was stored from a previous visit
        if (!seq.timeline.tracks.length) {
            let T = seq.timeline
            let k = (prop, keys, interp) => { let t = T.addTrack(prop, interp); keys.forEach(([tt, v]) => T.setKey(t, tt, v)) }
            k('spin', [[0, 0], [6, 360]], 'linear')
            k('size', [[0, 20], [3, 90], [6, 20]])
            k('hue', [[0, 20], [6, 300]], 'linear')
            k('pos', [[0, [200, 270]], [3, [480, 150]], [6, [760, 270]]], 'spline')
            seq.ui.refresh()
        }
        seq.seek(0)
        window.SEQ = seq                                   // for scripts and tests
    </script>
</body>
</html>
