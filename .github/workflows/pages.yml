# Publishes main to GitHub Pages: the repository as it is, submodules included -- there is no build step.
# Pages never serves .git, so the commit deployed is written into REVISION for version.js to read.
# Needs Settings > Pages > Source set to "GitHub Actions", once.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Stamp the revision
        run: echo "$GITHUB_SHA $GITHUB_REF_NAME" > REVISION
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
