<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Timeline tool · check</title>
<!-- THE TIMELINE TOOL WITHOUT A GPU, for tools/test/timeline.check.mjs: the shell, a viewport panel and the
     Timeline panel as app.html makes them, over a stand-in renderer that keeps a log of the offscreen verbs
     it is asked for and paints each frame in a colour of the value the timeline set, and two scenes that each keep
     their timeline through the builder's own model (builder/model.js TIMELINE), shown as the builder shows them.
     Everything the tool and lib/timeline do is their own. -->
<link rel="stylesheet" href="../../lib/dockview/dockview.css">
<link rel="stylesheet" href="../../lib/shell/shell.css">
<link rel="stylesheet" href="../../lib/timeline/timeline.css">
<link rel="stylesheet" href="../timeline.css">
<script src="../../lib/dockview/dockview.min.js"></script>
<style>html, body { height: 100%; margin: 0; } #app { height: 100%; }</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createShell, busyOverlay } from '../../lib/shell/shell.js'
import { makeParams } from '../../lib/shell/params.js'
import { installTimeline } from '../timeline.js'
import * as M from '../../builder/model.js'

const SHELL = createShell(document.getElementById('app'), { title: 'check', storageKey: null, menus: ['View', 'Tools'] })
const stage = SHELL.panel({ id: 'viewport', title: 'Viewport', renderer: 'always', closable: false })
Object.assign(stage.style, { overflow: 'hidden' })
const timelineEl = SHELL.panel({ id: 'tools.timeline', title: 'Timeline', module: 'app' })
SHELL.layout.setDefault(() => {
    SHELL.open('viewport')
    SHELL.open('tools.timeline', { referencePanel: 'viewport', direction: 'below' }, { height: 300 })
})
SHELL.layout.restore()

/* THE SCENE: a light's flux (live) and an object's shape (structural) */
const S = { flux: 100, shape: 0 }
const PARAMS = makeParams()
PARAMS.provide('scene', () => [
    { path: 'scene/lamp/light/flux', label: 'lamp › flux', group: 'scene · lamp', min: 0, max: 1000, get: () => S.flux, set: v => { S.flux = v } },
    { path: 'scene/box/shape', label: 'box › shape', group: 'scene · box', kind: 'structural', options: { cube: 0, sphere: 1 }, get: () => S.shape, set: v => { S.shape = v } },
])

/* THE RENDERER, standing in: the live size, and the four offscreen verbs, logged */
const log = []
let OFF = null, dirty = 0
const RT = {
    size: () => ({ w: 800, h: 600 }),
    invalidate: () => { log.push('invalidate'); dirty = 1 },
    async beginOffscreen({ width, height }) { log.push(`begin ${width}x${height}`); OFF = { w: width, h: height } },
    // the option logged too: a frame's samples are meant to overlap (inFlight 2), and only within the frame
    async renderFrame(n, onProgress, signal, o) {
        log.push(`render ${n}${o?.inFlight === 2 ? ' in flight' : ''} flux=${S.flux}${dirty ? '' : ' (not invalidated)'}`); dirty = 0
        await window.CHECK?.duringRender?.()          // a scene shown while it records (the check sets it)
    },
    async grabFrame() {
        const c = new OffscreenCanvas(OFF.w, OFF.h), g = c.getContext('2d')
        g.fillStyle = `rgb(${Math.round(S.flux / 4)}, 0, 0)`; g.fillRect(0, 0, OFF.w, OFF.h)
        log.push('grab'); return c
    },
    async endOffscreen() { log.push('end'); OFF = null },
}
/* THE SCENES, standing in for the builder's (builder/demo.js keepTimeline, markShown): each keeps its timeline in its
   document through the model, into the one shown; show(key) is a scene shown, its timeline handed to the panel whole */
const scenes = { a: M.createDoc({ title: 'A' }), b: M.setTimeline(M.createDoc({ title: 'B' }), { fps: 12 }) }
let shownKey = 'a'
const scene = { timeline: () => M.sceneTimelineOf(scenes[shownKey]),
                keep: t => { try { M.setTimeline(scenes[shownKey], t); return true } catch (e) { console.warn(e.message); return false } } }
const TL = installTimeline(timelineEl, { PARAMS, RT, stage, busy: busyOverlay(stage, { delay: 0 }),
    progress: job => SHELL.progress('video', job), onVisible: fn => SHELL.onVisible('tools.timeline', fn), scene, local: localStorage })
const show = k => { shownKey = k; TL.showScene(M.sceneTimelineOf(scenes[k])) }
window.CHECK = { SHELL, TL, S, log, stage, PARAMS, scenes, show }
</script>
</body>
</html>
