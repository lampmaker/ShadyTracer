               sample asked for while the builder applies or the renderer compiles returns nothing, which
               abandons the measurement until later. */
            let compiling = false;
            RT.onCompile(p => { compiling = !p.end; });
            const holdBoxes = () => compiling || BUILDER.applying;
            /* CULLING WANTS EVERY BOX (builder/codegen.js, the SDF's root): a top-level node is skipped while the
               point is farther than its box -- the cost the line above left behind, now in the background after the
               compile. Every node is measured, as while the renderer's setting `cull` was on (its default; gone in
               0.34.0): codegen tests a box on the dear nodes alone, but the records of a scene as data test every
               node's, and the step cache's box is made from them all (stepCacheBox below): createBoxes' `wanted` left at its default, every box. The
               toolbar's box button says only which are drawn (overlay.js). */
            const BOXES = window.BOXES = createBoxes({ sample: input => holdBoxes() ? Promise.resolve(null) : RT.sampleTags(input),
                doc: () => BUILDER.doc, ready: () => BUILDER.showing, onBox: () => pushCull() });
            /* THE BOXES INTO THE SHADER: each top-level node's box (cullBoxes: padded, or unknown while its shape
               has changed since it was measured) as its bxlo/bxhi uniforms -- only those that changed, and
               without restarting the picture (RT.set's reset false): with a box that contains its object, the
               picture is the same culled or not. Called as each box is measured, on the boxes' look twice a
               second, and after every live change (BUILDER.afterLive): a slider that grows an object makes its
               box unknown in the same call, so it is never cut off by the box it had. A new compile starts
               every box unknown (its uniforms' defaults), so the scene is followed here too. */
            const cullSent = new Map();
            let cullScene = null, dataBoxes = '';
            /* A SCENE AS DATA carries its boxes in its records (builder/scenedata.js): every node's under plain groups,
               not the top level's alone -- the records cull each -- made again and written when any changed */
            BUILDER.cullBoxes = () => cullBoxes(BUILDER.doc, BOXES, { nested: true });
            /* THE STEP CACHE'S BOX (builder/stepbox.js), while the developer setting stepCache is on: from the same boxes,
               made again only when they changed or the scene did -- it builds the scene's records, which is not a thing
               to do twice a second -- and set, which starts the cache and the picture over */
            let stepBoxKey = '', stepBoxScene = null;
            const pushStepBox = () => {
                if ((RT.get().stepCache | 0) === 0) { stepBoxKey = ''; return; }
                const key = JSON.stringify([...BUILDER.cullBoxes()]);
                if (key === stepBoxKey && RT.scene === stepBoxScene) return;
                stepBoxKey = key; stepBoxScene = RT.scene;
                RT.setStepCacheBox(stepCacheBox(BUILDER.doc, BOXES));
            };
            const pushCull = () => {
                if (!BUILDER.showing || RT.scene?.id !== 'built' || holdBoxes()) return;
                pushStepBox();
                if (RT.scene.writeData) {
                    const key = JSON.stringify([...BUILDER.cullBoxes()]);
                    if (RT.scene === cullScene && key === dataBoxes) return;
                    if (BUILDER.pushData({ reset: false })) { cullScene = RT.scene; dataBoxes = key; }
                    return;
                }
                if (RT.scene !== cullScene) { cullSent.clear(); cullScene = RT.scene; }
                const U = RT.scene.uniforms || {}, vals = {};
                for (const [id, b] of cullBoxes(BUILDER.doc, BOXES)) {
                    if (!(boxLoName(id) in U)) continue;                  // draws nothing: no box test emitted
                    const { lo, hi } = cullUniforms(b), key = `${lo}|${hi}`;
                    if (cullSent.get(id) === key) continue;
                    cullSent.set(id, key);
                    vals[boxLoName(id)] = lo; vals[boxHiName(id)] = hi;
                }
                if (Object.keys(vals).length) RT.set(vals, false);
            };
            /* ...and the lights' photons start from where the lights are now, in the same frame as the geometry that moved
               with them (optics/page.js O.followScene, 0.61.4): they followed a half-second tick, and lagged a drag */
            BUILDER.afterLive = () => { pushCull(); window.OPTICS?.followScene?.(); };
            // a live change a compile must make (a path's pieces changed shape: builder/demo.js liveValue), in the queue
            BUILDER.onRestructure = reapply;
            /* WHAT GOES UNCULLED, from the console: each top-level node without a box and why (boxes.js cullReport).
               A node never culled costs only speed, so nothing in the picture says so. */
            window.CULL_REPORT = () => cullReport(BUILDER.doc, BOXES);
            /* THE BAKE IN THE BACKGROUND (builder/baker.js; the developer setting sceneBake, Renderer > Performance): once
               the edits stop, the scene with its values constants compiled while the picture goes on and swapped in, the
               picture kept; the first edit puts the editing build back (an apply, in the tree's queue). Looked at with the
               boxes, below. Swapped in: the culling boxes sent to it (they stay uniforms), and the status says what it cost. */
            const BAKER = window.BAKER = createBaker({ RT, builder: BUILDER, wanted: () => (RT.get().sceneBake | 0) === 1, leave: reapply,
                onShown: (sc, r) => {
                    pushCull();
                    paintMode();
                    status(`${sc.title}  (baked: ${r.compiled} of ${r.total} kernels compiled in ${(r.ms / 1000).toFixed(1)} s, swapped in ${r.swapMs} ms)`);
                    console.log(`[bake] '${sc.title}' shown baked: ${r.compiled} of ${r.total} kernels compiled in ${r.ms} ms, swapped in ${r.swapMs} ms`);
                } });
            {
                let last = '';
                /* THE DEVELOPER SWITCH `sceneData` turned (BUILDER.dataMode): the scene shown made again the other way, once
                   a change -- what is shown is the reference, so a page opened on a codegen scene with the switch on is made
                   data at the first look. Code, or data (the grid and exact hits, its two other switches, went in 0.41.0).
                   A scene without its boxes (codegen `unculled`: the bench's
                   "boxes off" rows, the renderer's `cull` off until 0.34.0) counts as another mode, never the one
                   wanted; the bench puts the scene it found back when it ends (lib/pathtracer/tests.js run). */
                const modeOf = (data, unculled = false) => (data ? 'data' : 'code') + (unculled ? '-boxes' : '');
                const shownMode = () => modeOf(!!RT.scene?.writeData, !!RT.scene?.unculled);
                let wantedData = shownMode();
                paintMode = () => {
                    const m = modeLine({ scene: RT.scene, mode: shownMode(), showing: BUILDER.showing, bakeOn: (RT.get().sceneBake | 0) === 1,
                                         baker: BAKER.state, lastLeave: BUILDER.lastLeave });
                    if (modeEl.textContent !== m.text) modeEl.textContent = m.text;
                    modeEl.title = m.title;
                    modeEl.classList.toggle('baked', m.baked);
                    paintSaved();
                };
                setInterval(async () => {
                    const want = modeOf(BUILDER.dataMode);
                    if (want !== wantedData) {
                        wantedData = want;
                        if (BUILDER.showing && want !== shownMode()) reapply();
                    }
                    pushCull();
                    BAKER.tick();
                    paintMode();
                    if (BOXES.busy || !BUILDER.showing || holdBoxes()) return;
                    const now = BOXES.pending();
                    if (now && now === last) {
                        /* timed: each measurement compiles the tagged field once per scene and evaluates
                           the whole scene on lattices -- a cost every structural edit pays (PERFORMANCE.md) */
                        const t0 = performance.now();
                        try {
                            const done = await BOXES.update();
                            if (done.length) {
                                console.log(`[boxes] ${done.length} measured in ${(performance.now() - t0).toFixed(0)} ms`);
                                overlay.redraw();
                            }
                        }
                        catch (e) { console.warn('[boxes]', e); }
                    }
                    last = now;
                }, 500);
            }
            const overlay = installSelectionOverlay({ stage, canvas: ctx.canvas, RT, BUILDER, boxes: BOXES,
                onPick: id => builderTree?.select(id) });
            /* THE BOXES ON THE VIEW'S TOOLBAR, three states, one click each to the next: none, the
               selection's (the default), every object's and group's. The icon shows which; remembered. */
            {
                const STATES = [{ mode: 'none', icon: 'boxOff', tip: 'Bounding boxes: none (click: the selection\'s)' },
                                { mode: 'active', icon: 'box', tip: 'Bounding boxes: the selection\'s (click: all)' },
                                { mode: 'all', icon: 'boxes', tip: 'Bounding boxes: every object and group (click: none)' }];
                let k = 1;                        // the selection's, unless another was chosen before
                try { const i = STATES.findIndex(x => x.mode === localStorage.getItem('raytracer.boxes')); if (i >= 0) k = i } catch { }
                const holder = document.createElement('span');
                const show = () => {
                    const st = STATES[k];
                    const b = iconButton(st.icon, st.tip, () => {
                        k = (k + 1) % STATES.length;
                        try { localStorage.setItem('raytracer.boxes', STATES[k].mode) } catch { }
                        show();
                    });
                    lit(b, st.mode !== 'none');
                    holder.replaceChildren(b);
                    overlay.showBoxes(st.mode);
                };
                show();
                VIEW.bar.append(iconPill(holder));         // a switch: its own pill (icons.js)
                // beside it, the Points mode's legs switch (pointsmode.js), shown only while points are edited
                VIEW.bar.append(overlay.points.viewPill);
            }
            /* A NODE'S ROW DOUBLE-CLICKED: the camera glides to it (builder/focus.js), looking the way it looked -- the
               measured box if it is for the node as it is now, else the document's estimate (right for the stock
               shapes). An endless one (a plane) or one with no size known yet is said, and the camera stays. A press
               or a wheel in the view takes the camera back at once: the glide stops where it is. */
            let glide = 0;
            for (const ev of ['pointerdown', 'wheel']) stage.addEventListener(ev, () => { glide++; }, { passive: true });
            const focusOn = (id, again = true) => {
                const doc = BUILDER.doc, node = Model.find(doc, id)?.node;
                if (!node) return;
                const box = focusBox(doc, id, BOXES);
                if (!box) {
                    // corners() asked for it to be measured: the boxes look every half second and settle in two looks
                    if (again) setTimeout(() => { if (BUILDER.doc === doc) focusOn(id, false); }, 1200);
                    return status(again ? `${node.label}: measuring its size…` : `${node.label}: no size known to frame it by`);
                }
                if (box.open) return status(`${node.label} goes on without end: nothing to frame`);
                window.STUDIO?.releaseView();             // the library's pictures may have paused the view
                const was = RT.settings?.().camera ?? RT.cam?.get?.();
                if (!was) return;
                const to = focusPose(was, box);
                // where the glide starts: the orbit the camera is on, or a free camera's place as one (focus.js focusPose)
                const from = was.mode === 'orbit' ? was
                    : { target: was.target, distance: Math.hypot(...was.pos.map((v, k) => v - was.target[k])), dimensions: was.dimensions };
                const mine = ++glide, t0 = performance.now(), MS = 300;
                const step = now => {
                    if (glide !== mine) return;
                    const t = Math.min(1, (now - t0) / MS);
                    RT.applySettings({ camera: glidePose(from, to, t) });
                    if (t < 1) requestAnimationFrame(step);
                };
                requestAnimationFrame(step);
            };
            /* A SCENE'S CARD CHOSEN (builder/scenestrip.js) shows in Properties (panel.js showScene), the tree's selection
               cleared -- and stays shown through the tree's own onSelect(null), which every rebuild sends; a tree row chosen
               takes Properties back. Nothing is compiled for it: what it shows is read from the project. */
            const editing = () => !!window.ITEM_EDITOR?.active;
            const notWhileEditing = fn => (...a) => editing() ? status('close the library item first (over the view)') : fn(...a);
            let cardKey = null;
            const showCard = key => {
                const c = sceneCards(BUILDER.project, BUILDER.current).find(x => x.key === key), shot = PICS.get(SESSION.info().id, key);
                const info = c ? `${c.unit} · ${c.objects} object${c.objects === 1 ? '' : 's'} · ${c.lights} light${c.lights === 1 ? '' : 's'}`
                    + (shot?.openMs ? `\nopened in ${seconds(shot.openMs)} last time` : '') : '';
                const ops = builderTree.sceneOps;
                panel?.showScene(key, { picture: shot?.url ?? null, info, actions: {
                    open: notWhileEditing(k => ops.enter(k)), duplicate: notWhileEditing(k => ops.duplicate(k, { go: false })),
                    exportScene: k => BUILDER.saveScene(undefined, k), remove: notWhileEditing(k => ops.remove(k)), rename: (k, t) => ops.rename(k, t) } });
            };
            const selectRow = id => {
                if (id == null && cardKey && cardKey !== BUILDER.current && Project.scene(BUILDER.project, cardKey)) { showCard(cardKey); overlay.select(null); return; }
                cardKey = null; STRIP?.select(null);
                panel?.show(id); overlay.select(id);
            };
            const chooseCard = key => {
                if (key === BUILDER.current) { cardKey = null; return builderTree.select(BUILDER.doc.root.id); }
                cardKey = key;
                builderTree.select(null);                 // ...whose onSelect(null) shows the card
            };
            builderTree = installBuilderTree(el, BUILDER, {
                onStatus: status, onSelect: id => selectRow(id), onStructure: reapply,
                onFocus: id => focusOn(id),
                onLibrary: () => { SHELL.open('library'); window.LIBRARY_PANEL?.focus(); },
                // a library item's scene: its back row closes it (library/edit.js); Save is the strip's over the view
                onItem: (what, key) => {
                    const E = window.ITEM_EDITOR;
                    if (!E) return;
                    if (BUILDER.current !== key) builderTree.enterScene(key);
                    what === 'save' ? E.save() : E.close();
                },
            });
            /* THE LIBRARY: its items put in where a paste would go (the tree's selection), the selection
               kept as one's own. One's own live in IndexedDB; a browser that refuses it keeps them for
               the visit, and says so. */
            {
                let backend = indexedDbBackend();
                try { await backend.all(); } catch (e) { console.warn('[library] IndexedDB refused, your items last this visit:', e?.message); backend = memoryBackend(); }
                const library = window.LIBRARY = createLibrary({ model: Model, backend, files: ITEM_FILES,
                    load: async f => (await fetch(itemUrl(f))).json() });
                /* THE PICTURES (library/thumbs.js, library/studio.js): made by a second, quiet renderer --
                   the studio -- started the first time the panel is seen, and only while the view has
                   been left alone for a moment, so they never cost a frame of what is being worked on */
                let thumbStore = indexedDbThumbs();
                try { await thumbStore.get('probe'); } catch { thumbStore = memoryThumbs(); }
                let lastViewInput = 0;
                // touching the view gives it back at once, if the studio had paused it (window.STUDIO, once made)
                const viewInput = () => { lastViewInput = Date.now(); window.STUDIO?.releaseView(); };
                for (const ev of ['pointerdown', 'pointermove', 'wheel']) stage.addEventListener(ev, viewInput, { passive: true });
                window.addEventListener('keydown', e => { if (!e.target.closest?.('input, textarea, .shell-lib')) viewInput(); });
                let studio = null, studioStarting = null;
                const thumbs = window.THUMBS = createThumbs({ backend: thumbStore, idle: () => Date.now() - lastViewInput > 1500 });
                /* the view stops while the studio renders -- they share the GPU -- and starts again after */
                const pauseView = () => { const was = RT.running(); RT.stop(); return () => { if (was && !RT.running()) RT.start(); }; };
                const note = t => window.LIBRARY_PANEL?.note(t);
                const startStudio = () => studioStarting ??= (note('Preparing the pictures: starting a second renderer, once...'),
                    createStudio({ gpu: WG, pauseView }))
                    /* told everything first: an item it has not been told of rebuilds its unit's scene -- a
                       compile each -- where the whole list makes one scene per unit, compiled once */
                    .then(async S => {
                        note(''); S.onStatus(note);
                        S.onCompile(p => SHELL.progress('pictures', p));
                        S.know(await library.list()); studio = window.STUDIO = S; thumbs.setRender(item => S.render(item));
                    })
                    .catch(e => { note(''); console.error('[studio]', e); status(`library pictures: ${e.message}`); });
                // an item kept or imported makes its unit's scene stale: rebuilt once, when next shown
                library.on(async () => { if (studio) studio.know(await library.list()); });
                /* DRAGGED OUT OF THE LIBRARY onto the tree (builder/tree.js acceptLibrary) or the picture: a material
                   onto the object under the pointer, anything else into the scene, standing where it lands */
                let dragged = null;
                builderTree.acceptLibrary(() => dragged);
                stage.addEventListener('dragover', e => {
                    if (!dragged) return;
                    e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
                    stage.classList.add('shell-drop-target');
                });
                stage.addEventListener('dragleave', e => { if (!stage.contains(e.relatedTarget)) stage.classList.remove('shell-drop-target'); });
                stage.addEventListener('drop', async e => {
                    const it = dragged;                       // dragend clears it while the pick is awaited
                    if (!it) return;
                    e.preventDefault();
                    stage.classList.remove('shell-drop-target');
                    let hit = null;
                    try { hit = await overlay.probe(e.clientX, e.clientY); } catch (err) { console.warn('[library] drop:', err); }
                    if (it.asset.kind === 'material') {
                        if (!hit?.id) return status(`${it.name}: drop a material onto an object`);
                        if (builderTree.dropAsset(it.asset, { mid: hit.id })) status(`${it.name} on ${hit.id}`);
                    } else if (builderTree.dropAsset(it.asset, { pos: hit?.pos ?? null })) status(`put in: ${it.name}`);
                });
                /* EDITING AN ITEM (library/edit.js): a scene of its own, the tree isolated on it, Save and Close
                   over the view */
                window.ITEM_EDITOR = installItemEditor({ BUILDER, RT, SHELL, library, tree: builderTree, stage, say: status, thumbs });
                window.LIBRARY_PANEL = installLibraryPanel(libraryEl, { library, say: status, thumbs, drag: it => { dragged = it; },
                    live: (item, el) => studio ? studio.live(item, el) : null,
                    insert: (asset, name) => { builderTree.insertAsset(asset); status(`put in: ${name}`); },
                    selection: () => builderTree.selectedAsset(),
                    edit: item => window.ITEM_EDITOR.open(item) });
                // after the panel exists: a panel already showing is told at once, and the note needs the panel
                SHELL.onVisible('library', v => { if (v) startStudio(); });
            }
            panel = builderPanel = installBuilderPanel(propsTable, BUILDER, {
                onLabel: () => builderTree.rebuild(),
                onStructure: reapply,
                onApply: () => builderTree.apply(),
                params: PARAMS, environment: () => RT.get(),
                // the scene row's camera and exposure (builder/panel.js cameraFolder, exposureFolder): the renderer's own fields
                view: { cameraBindings: () => RT.cameraBindings(), cameraShown: () => RT.cameraShown(), exposure: () => RT.view().exposure,
                        setExposure: (k, v) => RT.applyView({ exposure: { [k]: v } }), watch: f => RT.watchView(f) },
                // a material item's sample shape and size (library/edit.js): the library's, handed to the builder;
                // a new size is framed afresh, since the camera was where the other size wanted it
                itemSample: { choices: SAMPLE_CHOICES, sizes: SAMPLE_SIZES, of: sampleOf,
                    set: (doc, shape, size) => { const was = sampleOf(doc); setSample(doc, shape, size); if (was?.size !== size) window.ITEM_EDITOR?.frame() } },
            });
            /* THE SCENE'S PARAMETERS: the current scene's, asked afresh each time, so a node added,
               deleted, undone or loaded is in or out of the list at once. What a change does is the
               properties panel's (builder/params.js makeAfter): the same uniform, undo step, compile. */
            PARAMS.provide('scene', () => sceneParams(BUILDER.doc, {
                live: (id, k) => BUILDER.live(id, k), commit: key => BUILDER.commit(key), structure: reapply,
                syncSources: () => BUILDER.syncSources(), onLabel: () => builderTree.rebuild(),
                reveal: id => { builderTree.select(id); SHELL.open('properties'); },
                environment: () => RT.get(),
            }));

            /* A FILE TO SAVE, and one to open: the browser's download, and its picker (resolving null if cancelled) */
            const downloadText = (name, text) => {
                const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
                Object.assign(document.createElement('a'), { href: url, download: name }).click();
                setTimeout(() => URL.revokeObjectURL(url), 0);
            };
            const pickFile = () => new Promise(res => {
                const input = Object.assign(document.createElement('input'), { type: 'file', accept: '.json,application/json' });
                input.onchange = async () => { const f = input.files?.[0]; res(f ? { name: f.name, text: await f.text() } : null); };
                input.oncancel = () => res(null);
                input.click();
            });
            /* THE EXAMPLES (scenes/index.js): the bundled scenes, a COPY of one into the project from the Project panel -- the
               same as opening its file (demo.js load: put after the scene being worked on, and worked on) -- by audience and
               group, each with what it shows (scenes/examples.js, made by scenes/make.mjs), and seen as its file says: an
               example is a place to look from as much as a scene (0.54.0), its camera and exposure in its document since
               0.65.0 (builder/model.js VIEW) */
            examples = {
                list: EXAMPLES.map(e => ({ id: e.file, title: e.title, audience: e.audience, group: e.group, description: e.description })),
                open: async file => openText(await (await fetch(urlOf(file))).text(), file),
            };
            const ops = builderTree.sceneOps;
            const picture = key => PICS.get(SESSION.info().id, key);
            const exportScene = key => BUILDER.saveScene(undefined, key);
            const exportProject = () => BUILDER.saveWorkspace(projectFileName(SESSION.info().name));
            /* THE PROJECT PANEL (workspace/projectview.js): a tab beside the picture when it is not open (the user, 2026-10-17:
               "if it isnt open, open it in the same pane as the viewport"), brought forward when it is; the picture brought
               back (showWork) once a scene, an example or another project is chosen in it */
            const showWork = () => SHELL.open('viewport');
            const openProject = section => {
                if (SHELL.isOpen('project')) SHELL.open('project');
                else SHELL.open('project', { referencePanel: 'viewport', direction: 'within' });
                requestAnimationFrame(() => PROJECT_VIEW?.at(section));
            };
            PROJECT_VIEW = window.PROJECT_VIEW = installProjectView(projectEl, { session: SESSION, BUILDER, ops, picture, examples,
                importFile: () => ACTIONS.importFile(), exportProject, exportScene, download: downloadText, app: stamp, showWork,
                item: editing, onRemoved: id => PICS.removeProject(id), say: status });
            SHELL.onVisible('project', v => PROJECT_VIEW.visible(v));
            /* THE PROJECT AND ITS SCENES OVER THE TREE (builder/scenestrip.js): one line, a card each */
            STRIP = window.STRIP = installSceneStrip(swHost, { BUILDER, ops, tree: builderTree, project: () => SESSION.info(), picture,
                onSelect: key => chooseCard(key), openProject, item: editing, compile: () => builderTree.apply(), exportScene, say: status });
            PICS.on(() => STRIP.refresh());
            /* THE SCENE'S PICTURE, taken from the live one once it has settled (workspace/scenepics.js; RT.thumbnail) */
            window.CAPTURE = startCapture({ RT, BUILDER, pics: PICS, project: () => SESSION.info().id });
            /* ANOTHER PROJECT SHOWN (workspace/session.js open, create): its scenes into the builder -- a history of its
               own -- its renderer settings, its item being edited if it had one, and its scene compiled */
            showProject = async (w, item) => {
                BUILDER.replace({ project: w.project, current: w.current });
                // nothing selected: scene keys start again in every project, so `s1:n5` would name another node
                builderTree.select(null);
                const unknown = RT.applySettings(w.renderer || {});
                if (unknown.length) console.warn(`[projects] settings this renderer does not have, ignored: ${unknown.join(', ')}`);
                await window.ITEM_EDITOR?.adopt(item);
                cardKey = null;
                STRIP.refresh();
                await builderTree.apply();
                /* ITS SCENE DID NOT COMPILE: the picture would be the last project's scene, under this one's tree -- the
                   empty scene instead, as at a start (start.js); the ▶ over the tree compiles it once it is fixed. Not while
                   a compile is still on its way: that one decides. */
                if (!BUILDER.showing && !BUILDER.applying) {
                    try { await RT.setScene(NOTHING); } catch (e) { console.error('[projects] the empty scene:', e); }
                }
            };

            /* UNDO / REDO. A restored project goes to the tree and panel through onDoc, like a
               load; the renderer then needs either its uniforms pushed (only values differ --
               BUILDER.undo did that already) or an apply (the shader text differs, or the step
               was in another scene, which is now current). */
            const step = which => {
                const r = which === 'undo' ? BUILDER.undo() : BUILDER.redo();
                if (r === null) return status(`nothing to ${which}`);
                if (r === 'structural') builderTree.apply();
                else status(which === 'undo' ? 'undone' : 'redone');
            };
            /* A FILE FROM DISK, the picker's (File › Import from file…) or one dropped on the page. A SCENE file joins the
               project being worked on (demo.js load: after the current scene, and worked on). A PROJECT file -- every scene,
               and a workspace's with their cameras and the render settings -- ASKS (0.63.0): a project of its own in this
               browser (what a workspace file always became: replacing the work open would throw it away), or its scenes
               added to this one (what an all-scenes file did: the one way to bring another project's scenes in). Projects
               kept in this browser are not files: the Project panel opens them. Each scene brings its view in its document
               (builder/model.js VIEW, 0.65.0). */
            const openText = async (text, name = 'file') => {
                try {
                    let kind = null;
                    try { kind = Project.parse(text); } catch { }      // a bad file: load() below says all that is wrong with it
                    const many = kind?.workspace?.project ?? kind?.project;
                    if (many) {
                        const n = many.scenes.length, here = SESSION.info().name;
                        const titles = many.scenes.slice(0, 4).map(x => x.doc.title).join(', ') + (n > 4 ? ', …' : '');
                        const how = await ask({ title: `${name} holds ${n} scene${n === 1 ? '' : 's'}`,
                            text: `${titles}${kind.workspace ? ', with their cameras and the render settings' : ''}. What should become of ${n === 1 ? 'it' : 'them'}?`,
                            choices: [
                                { value: 'new', label: 'Open as a project of its own', note: `kept in this browser beside ${here}, and opened` },
                                { value: 'add', label: n === 1 ? `Add its scene to ${here}` : `Add its ${n} scenes to ${here}`,
                                  note: 'after the scene being worked on; this project keeps its own render settings' }] });
                        if (how === 'new') {
                            await SESSION.importText(text, String(name).replace(/\.json$/i, ''));
                            showWork();
                            return status(`opened ${name} as a project of its own`);
                        }
                        if (how !== 'add') return status('nothing imported');
                        status(BUILDER.load(kind.workspace ? Project.serialize(many) : text));
                        return builderTree.apply();
                    }
                    status(BUILDER.load(text));
                    builderTree.apply();
                } catch (e) {
                    // a ModelError lists every problem with the file; the project is unchanged
                    console.error('[builder] load failed:', e);
                    status('IMPORT FAILED: ' + (e.problems ? e.problems[0] + (e.problems.length > 1 ? ` (+${e.problems.length - 1} more, see console)` : '') : e.message));
                }
            };
            const importFile = async () => { const f = await pickFile(); if (f) await openText(f.text, f.name); };
            /* DROPPED FILES only -- the tree's own drags are rows, not files, and must reach it
               untouched, so anything without 'Files' in it is left alone. */
            const isFile = e => [...(e.dataTransfer?.types || [])].includes('Files');
            window.addEventListener('dragover', e => { if (isFile(e)) e.preventDefault(); });
            window.addEventListener('drop', e => {
                if (!isFile(e)) return;
                e.preventDefault();
                for (const f of e.dataTransfer.files) if (/\.json$/i.test(f.name) || f.type === 'application/json')
                    f.text().then(t => openText(t, f.name));
            });
            /* the same actions for the toolbar and the menu bar: the toolbar keeps its keys (Ctrl Z, Ctrl S, Ctrl O), the menus
               only show them. WHILE A LIBRARY ITEM IS EDITED (library/edit.js) Ctrl+S saves it -- what the user is working on
               -- and a new project or a file read in would leave its isolation behind, so they wait for it to close */
            /* CTRL+S, WITH NO MENU ROW (0.63.0): the project is written to this browser as it changes (workspace/autosave.js),
               so this only does it at once and says so -- kept because people press it; a library item's save is real */
            const saveNow = async () => {
                await SESSION.saveNow();
                const i = SESSION.info();
                status(i.id ? `saved in this browser: ${i.name} (it is saved as it changes)` : `nothing changed yet: this tab's copy of '${i.copy}' is kept once something is`);
            };
            /* EXPORT ▸ 3D PRINT: the scene's Export box, whose Properties hold Export 3MF and Export STL (panel.js) */
            const exportPrint = () => {
                let box = null;
                Model.walk(BUILDER.doc, n => { if (!box && n.type === 'export') box = n; });
                if (!box) return status('this scene has no Export box: ＋ on a group\'s row › Export box (3MF / STL) adds one; its Properties hold Export 3MF and Export STL');
                builderTree.select(box.id);
                SHELL.open('properties');
                status(`${box.label}: Export 3MF and Export STL are in its Properties`);
            };
            ACTIONS = {
                undo: () => step('undo'), redo: () => step('redo'),
                importFile: notWhileEditing(importFile), open: notWhileEditing(importFile),
                newProject: notWhileEditing(() => SESSION.create().then(showWork).catch(e => { console.error('[projects]', e); status(`new project: ${e.message}`); })),
                projects: () => openProject(),
                exportScene: () => exportScene(BUILDER.current), exportProject, exportPrint,
                saveNow, saveKey: () => editing() ? window.ITEM_EDITOR.save() : saveNow(),
                canUndo: () => BUILDER.canUndo, canRedo: () => BUILDER.canRedo,
            };
            toolbar = installToolbar(SHELL.tools, ACTIONS);       // Undo and Redo on the menu bar, after the menus; and the keys
            status(first.title);
        }

        /* THE OPTICS PAGE: the technical ray trace over the same scene (lib/pathtracer/optics). It
           compiles nothing and allocates nothing until Run or Reset is pressed, so a session that
           never opens it renders exactly as before. */
        // onEdit: the page wrote into the document (the colour mixing's fluxes) -- the panel shows it
        /* its charts are the panels registered above, each with its own settings on it: the page draws one
           while it is seen */
        const charts = {
            set: CHARTS,
            el: chartEls,
            onVisible: (id, fn) => SHELL.onVisible(id, fn),
            /* A CHART MADE IN THE PAGE (another map): its panel registered, its View entry, and opened to the
               right of the one it was made from -- side by side, to compare -- or of the first of its kind */
            add: (c, near) => {
                const el = chartPanel(c);
                SHELL.standardCommands();
                const by = [near, ...CHARTS.list().filter(o => o.type === c.type).map(o => o.id)].find(id => id !== c.id && SHELL.isOpen(id));
                if (by) SHELL.open(c.id, { referencePanel: by, direction: 'right' });
                else openChart(c.id);
                return el;
            },
            remove: id => { SHELL.forget(id); delete chartEls[id]; },
        };
        /* A CHART OPENED where nothing says where: brought to the front when open; else beside another open
           chart (a tab of its group), else under the picture */
        const openChart = id => {
            if (SHELL.isOpen(id)) return SHELL.open(id);
            const other = CHARTS.list().map(c => c.id).find(o => o !== id && SHELL.isOpen(o));
            SHELL.open(id, other ? { referencePanel: other, direction: 'within' } : { referencePanel: 'viewport', direction: 'below' },
                       other ? undefined : { height: Math.round(stage.clientHeight * 0.45) });
        };
        const mixing = { el: mixingEl, onVisible: fn => SHELL.onVisible('tools.mixing', fn) };
        window.OPTICS = installOpticsPage(opticsEl, { RT, WG, BUILDER, tableIn, charts, mixing,
            onEdit: () => builderPanel?.refresh(), boxes: window.BOXES, view: VIEW });

        /*=========================================================================================
          THE PARAMETERS, seen: where each is set (reveal), the Parameters panel, the palette.
        =========================================================================================*/
        {
            /* where a setting's own control is: a scene node's row selects it (its entry says so); the
               renderer's are by the path's first parts, which say what they change */
            const reveal = p => {
                if (p.reveal) return p.reveal();
                const [a, b] = p.path.split('/');
                if (a === 'renderer') return SHELL.open('renderer');
                if (a === 'view') { SHELL.open('viewport'); VIEW.open({ show: 'Show', exposure: 'Exposure', camera: 'Camera' }[b]); }
            };
            installParamsPanel(paramsEl, PARAMS, { reveal, say: t => SHELL.status(t) });
            // the palette finds settings, after the commands; "name = value" sets one
            SHELL.searchIn(paramsSearch(PARAMS, { reveal, say: t => SHELL.status(t) }));
            /* A VALUE CHANGED FROM ELSEWHERE -- the palette, the Parameters panel, a script: the tables
               follow (the scene's bind to the document's own values). A light's are copies the panel
               made (its colour-by, its flux or luminance), so its panel is rebuilt, once a frame. */
            let again = 0;
            PARAMS.onChange(e => {
                if (e.source === 'panel') return;
                refresh();
                if (e.path.includes('/light/') && !again) again = requestAnimationFrame(() => { again = 0; builderPanel?.refresh(); });
            });
        }

        /* THE TIMELINE (tools/timeline.js): the parameters' live entries over time, and RECORD films them
           through the renderer's offscreen verbs, with the view covered meanwhile. TIMELINE in the console. */
        window.TIMELINE = installTimeline(timelineEl, { PARAMS, RT, stage, busy: busyOverlay(stage, { delay: 0 }),
            progress: job => SHELL.progress('video', job), onVisible: fn => SHELL.onVisible('tools.timeline', fn) });

        /* THE MEASURE TOOL: pinned readings and a rectangle's average over the picture, and the
           false colour's legend (lib/pathtracer/measure). Reads nothing until something is placed. */
        window.MEASURE = installMeasureTool({ stage, canvas: ctx.canvas, RT, toolbar: VIEW });     // its buttons: the analysis drawer's Measure

        /*=========================================================================================
          THE MENU BAR'S COMMANDS: File, Edit, Analysis and Help are the application's; View is the
          shell's own (one entry per panel). Five menus since 0.63.0 (UI_PLAN.md section 11): no
          Render settings menu -- every row of it was the Render settings panel's or the view's
          Quality ▾ and ⚡ again -- and no Window menu -- the buttons on every panel group's header.
          Their commands stay, menu-less, for the palette (Ctrl K) and the help's links: a command
          need not be a row. Shortcuts are shown, not bound: the toolbar and the tree listen for them.
        =========================================================================================*/
        {
            const C = SHELL.command, A = () => ACTIONS;
            const savePicture = () => SHELL.open('output', undefined, undefined, { floating: { width: 420, height: 760 } });
            const itemOpen = () => !!window.ITEM_EDITOR?.active;
            /* FILE (builder/filemenu.js), five rows: New project · Projects… | Import from file… · Export ▸ | Save picture….
               The scenes are on their cards over the tree and in the Project panel; the project is saved as it changes. */
            for (const c of fileCommands({ item: { active: itemOpen },
                actions: { newProject: () => A().newProject(), projects: () => A().projects(), importFile: () => A().importFile(),
                           exportScene: () => A().exportScene(), exportProject: () => A().exportProject(), exportPrint: () => A().exportPrint(),
                           picture: savePicture } }))
                C(c);
            // ...and the scenes' own commands, menu-less: new, duplicate, delete the one being worked on
            for (const c of sceneCommands({ BUILDER, ops: builderTree.sceneOps, item: { active: itemOpen }, say: status })) C(c);
            C({ id: 'edit.undo', menu: 'Edit', label: 'Undo', keys: 'Ctrl Z', when: () => !!A()?.canUndo(), run: () => A().undo() });
            C({ id: 'edit.redo', menu: 'Edit', label: 'Redo', keys: 'Ctrl Y', when: () => !!A()?.canRedo(), run: () => A().redo() });
            /* THE RENDERER'S SWITCHES, IN NO MENU (0.63.0; the user, 2026-10-17: "Those are already covered by the icons in the
               viewport and settings in the render pane"). The palette keeps them, "Render" in each label so the word finds
               them -- the palette reads a command's menu and label, and there is no menu. The environment is the scene row's
               properties (tree.js select maps its id to it). */
            C({ id: 'render.environment', label: 'Render: the scene\'s environment (sun, sky, studio)', run: () => { builderTree.select(Model.ENVIRONMENT_ID); SHELL.open('properties'); } });
            /* THE QUALITY PRESETS (lib/pathtracer/quality.js), as the Render settings panel's Quality box and the view's
               Quality ▾ set them */
            for (const q of QUALITY_PRESETS)
                C({ id: `render.quality.${q.id}`, label: `Render quality: ${q.label}`, help: q.help,
                    run: () => applyPreset(q.id, RT.get(), v => RT.set(v)) });
            /* FAST WHILE MOVING (0.59.0; quality.js effective, the view's ⚡ and its Quality menu): a full picture traced as
               Draft or Sketch while the camera, a drag or a live value moves */
            C({ id: 'render.moveFast', label: 'Render: fast while moving on / off',
                help: 'While the camera or an object moves, a full picture is traced as Draft or Sketch, and comes back when it stops',
                run: () => RT.set({ moveFast: ((RT.get().moveFast ?? 1) | 0) ? 0 : 1 }) });
            for (const [m, name, help] of [[1, 'Draft', 'the light and the shadows kept'], [2, 'Sketch', 'a flat light, the lightest']])
                C({ id: `render.moveMode.${name.toLowerCase()}`, label: `Render: fast while moving, as ${name}`,
                    help: `A move traces as ${name}: ${help}`, run: () => RT.set({ moveFast: 1, moveMode: m }) });
            C({ id: 'render.lampsOnly', label: 'Render: lamps only (no sun, sky or studio light) on / off',
                help: 'The view lit by the scene\'s own lights; the scene keeps its environment (Render settings › Light sources › Sun, sky or studio)',
                run: () => RT.set({ lampsOnly: (RT.get().lampsOnly | 0) ? 0 : 1 }) });
            C({ id: 'render.lightRays', label: 'Render: lights\' rays (the light objects\' photons) on / off',
                help: 'Off, the camera\'s paths count a light\'s face themselves: noisier through glass, and a point, a ray file or a collimated beam lights nothing',
                run: () => RT.set({ lightRays: ((RT.get().lightRays ?? 1) | 0) ? 0 : 1 }) });
            /* THE ANALYSIS PANE shown and hidden (the user, 2026-10-10): where Design keeps it, a tab beside
               Render settings, or left of the picture when that is not open; hidden, Design is what the Render
               layout was */
            C({ id: 'analysis.setup', menu: 'Analysis', group: 'setup', label: 'Analysis setup: show / hide',
                help: 'The Analysis pane: ▶ Run, the sources, detectors and totals every chart is made from',
                run: () => SHELL.isOpen('optics') ? SHELL.close('optics')
                    : SHELL.isOpen('renderer') ? SHELL.open('optics', { referencePanel: 'renderer', direction: 'within' })
                    : SHELL.open('optics', { referencePanel: 'viewport', direction: 'left' }, { width: 330 }) });
            /* A CHART OF A KIND, with its own settings (optics/charts.js): the kind's first chart when it is closed, another when
               it is open; a chart's ⧉ makes one like it. One row, New chart ▸ (0.63.0: six rows were "New chart: X"); each kind
               is also a command of its own, menu-less, for the palette */
            const newChart = c => SHELL.isOpen(c.id) ? window.OPTICS.addChart(c.key) : openChart(c.id);
            for (const c of OPTICS_CHARTS)
                C({ id: `optics.new.${c.key}`, label: `New chart: ${c.title}`,
                    help: 'The first of this kind if it is closed, else another, with settings of its own (a chart\'s ⧉ copies its settings instead)',
                    run: () => newChart(c) });
            C({ id: 'analysis.newChart', menu: 'Analysis', group: 'charts', label: 'New chart',
                help: 'A chart of a kind: the first of it if it is closed, else another, with settings of its own',
                items: () => OPTICS_CHARTS.map(c => ({ label: c.title, run: () => newChart(c) })) });
            /* EVERY CHART THAT EXISTS, to bring one back: View listed them until they left it, and a closed chart
               had no other way back -- New chart opens the kind's first only while it is closed */
            C({ id: 'analysis.charts', menu: 'Analysis', group: 'charts', label: 'Open chart',
                help: 'Every chart there is, open or closed: the one chosen brought to the front',
                items: () => CHARTS.list().map(c => ({ label: `${SHELL.isOpen(c.id) ? '● ' : ''}${c.title}`, run: () => openChart(c.id),
                    title: SHELL.isOpen(c.id) ? 'Open: brought to the front' : 'Closed: opened beside the other charts' })) });
            /* THE HELP: its links act on the page through these (help/links.js) -- an example opened as the Project panel
               opens one, a command run as its menu entry would, a panel opened and outlined for a moment so the eye finds it */
            const flash = el => { if (!el) return false; el.classList.add('help-flash'); setTimeout(() => el.classList.remove('help-flash'), 1600); return true };
            const HELP = window.HELP = installHelp(helpEl, {
                say: status,
                openExample: file => examples?.open(file),
                runCommand: id => {
                    const c = SHELL.registries.commands.get(id);
                    if (!c || c.items || !c.when()) return false;
                    c.run(); return true;
                },
                show: target => {
                    if (target.startsWith('menu:')) {
                        const name = target.slice(5);
                        return flash([...document.querySelectorAll('.shell-menu')].find(b => b.textContent.trim() === name));
                    }
                    if (!SHELL.registries.panels.has(target)) return false;
                    SHELL.open(target);
                    return flash(document.querySelector(`[data-panel="${CSS.escape(target)}"]`));
                },
            });
            C({ id: 'help.contents', menu: 'Help', group: 'help', label: 'Contents', keys: 'F1', run: openHelp,
                help: 'How to use ShadyTracer: modelling and rendering, optical design, and a reference of every shape and setting' });
            window.addEventListener('keydown', e => { if (e.key === 'F1') { e.preventDefault(); openHelp(); } });
            C({ id: 'help.layout', menu: 'Help', label: 'Arranging the panels', run: () => SHELL.status(
                'Drag a tab to dock it anywhere · ⧉ floats a group · ⇱ pops it out to its own window · ⤢ maximises · View reopens a closed panel · View > Reset the layout') });
            /* WHEN THE PICTURE IS WRONG AND NOTHING SAYS WHY (diagnose.js): where its photons went, and
               whether the page ran files from the browser's cache that the server has changed since --
               copied, to paste back */
            C({ id: 'help.report', menu: 'Help', group: 'diagnose', label: 'Report: the picture\'s light and the page\'s files (copied)', run: async () => {
                SHELL.status('report: comparing the cached files with the server\'s...');
                const text = await report({ RT, OPTICS: window.OPTICS });
                try { await navigator.clipboard.writeText(text); } catch { }
                const stale = /STALE/.test(text);
                SHELL.status(stale ? 'report copied -- the page ran STALE files: Help › Reload every file fresh' : 'report copied (also in the console)');
            } });
            C({ id: 'help.fresh', menu: 'Help', group: 'diagnose', label: 'Reload every file fresh (past the browser\'s cache)', run: () => reloadFresh() });
            C({ id: 'help.about', menu: 'Help', label: 'About', run: () => SHELL.status(`${versionText()} © Matthijs Keuper · a wavefront SDF path tracer with a technical optics trace · what changed: CHANGELOG.md`) });
        }

        //==============================================================================================================
        /* THE FIRST COMPILE (start.js firstCompile): a scene that will not build leaves the renderer on the empty one,
           nothing of the project shown, and a note of why -- the probe's report names the node and the line. The
           start is done either way, so the next one is not a safe start. */
        const failed = await firstCompile({ RT, BUILDER, nothing: NOTHING });      // init itself, on a safe start too
        const startNote = safeStart ? safeNote(first.title, SAFE) : failed;
        started(localStore);
        /* THE PROJECT AS IT WAS LEFT (workspace/): the renderer's settings -- quality, size: not the camera, the exposure
           or the tolerance, which are each scene's and came back with it (builder/model.js VIEW); after init,
           since a size needs the canvas's buffers -- and a library item that was being edited, taken up again with its
           strip over the view, without framing the camera the project kept. Then what counts as saved is what is
           there, and the autosave looks once a second, when the tab is hidden, and as the page goes. */
        {
            const unknown = RT.applySettings(START.workspace.renderer || {});
            if (unknown.length) console.warn(`[projects] settings this renderer does not have, ignored: ${unknown.join(', ')}`);
            await window.ITEM_EDITOR?.adopt(START.item);
            AUTOSAVE.since();
            // when it last wrote, for the status bar's "saved" (paintSaved): tick() resolves true when it did
            setInterval(async () => { if (await AUTOSAVE.tick()) savedAt = Date.now(); }, 1000);
            document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') AUTOSAVE.tick(); });
            window.addEventListener('pagehide', () => { AUTOSAVE.flush(); AUTOSAVE.tick(); });
            const note = [storeNote, START.note, startNote].filter(Boolean).join(' · ');
            if (note) { status(note); console.warn('[projects]', note); }
        }
        RT.start()
    </script>
</body>

</html>
