<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadyTracer</title>
    <link rel="stylesheet" href="style.css">
    <!-- the docking (lib/dockview, MIT, vendored) and the shell made on it (lib/shell) -->
    <link rel="stylesheet" href="./lib/dockview/dockview.css">
    <link rel="stylesheet" href="./lib/shell/shell.css">
    <!-- the keyframe timeline and video export (lib/timeline), and its look in a panel (tools/) -->
    <link rel="stylesheet" href="./lib/timeline/timeline.css">
    <link rel="stylesheet" href="tools/timeline.css">
    <link rel="stylesheet" href="help/help.css">
    <script src="./lib/dockview/dockview.min.js"></script>
</head>

<body>
    <div class="content" id="container"></div>
    <script type="module">
        //==============================================================================================================
        // THE RAYTRACER APPLICATION -- a HOST for lib/pathtracer, not the renderer itself.
        //
        // What this page owns: the device, the window layout, and the scene builder -- which is
        // where every scene lives now. What it does not own, any more: the render loop, the camera, the uniform
        // assembly, and the View / Light / Sampling / Material / Advanced / Tests pages. Those
        // belong to the renderer and arrive with it, because a weave editor or an erosion sim
        // wants exactly those and none of this.
        //
        // The test of whether the extraction is real is not this file's length. It is that a
        // second host -- no side panel, no canvas, calling step(64) and writing a PNG -- needs
        // nothing from here.
        //==============================================================================================================
        import { PropertyTable } from './lib/guistuff/propertytable/propertytable.js';
        import { UTILITY } from "./lib/utils.js"
        import { CAMERA } from "./lib/camera.js"
        import { WEBGPU } from "./lib/tinywebgpu/src/tinywebgpu.js"
        import { defines, TOKENS, SHORT_TOKENS } from "./lib/wgsl_shorthand.js"
        import { createPathTracer } from "./lib/pathtracer/index.js"
        import { installViewToolbar } from "./lib/pathtracer/viewtools.js"
        import { QUALITY_PRESETS, applyPreset } from "./lib/pathtracer/quality.js"
        import { createShell, busyOverlay } from "./lib/shell/shell.js"
        import { compileFraction, compileLabel } from "./lib/pathtracer/core/compileprogress.js"
        import { makeParams } from "./lib/shell/params.js"
        import { installParamsPanel, paramsSearch } from "./lib/shell/paramspanel.js"
        import { EXAMPLES, FIRST_VISIT, urlOf } from './scenes/index.js'
        import { benchTest } from './bench/index.js'
        import { scalingTest } from './bench/scaling.js'
        import { sceneDataTest } from './bench/scenedata.js'
        import { overheadTest } from './bench/overhead.js'
        import { stepCacheTest } from './bench/stepcache.js'
        import { bakeTest } from './bench/bake.js'
        import { buildsTest } from './bench/builds.js'
        import { animatedTest } from './bench/animated.js'
        import { boxCostTest } from './bench/boxcost.js'
        import { dichroicsTest } from './bench/dichroics.js'
        import { installBuilder } from './builder/demo.js'
        import { createBaker } from './builder/baker.js'
        import { modeLine } from './builder/modeline.js'
        import * as Model from './builder/model.js'
        import * as Project from './builder/project.js'
        import { generate, boxLoName, boxHiName } from './builder/codegen.js'
        import { installBuilderTree } from './builder/tree.js'
        import { installSceneStrip, sceneCards, seconds } from './builder/scenestrip.js'
        import { fileCommands, sceneCommands } from './builder/filemenu.js'
        import { installBuilderPanel } from './builder/panel.js'
        import { sceneParams, viewEntriesFlagged } from './builder/params.js'
        import { createBoxes, cullBoxes, cullUniforms, cullReport } from './builder/boxes.js'
        import { stepCacheBox } from './builder/stepbox.js'
        import { lightBench } from './builder/lightbench.js'
        import { iconButton, iconPill, lit } from "./lib/pathtracer/icons.js"
        import { installToolbar } from './builder/toolbar.js'
        import { installSelectionOverlay } from './builder/overlay.js'
        import { focusBox, focusPose, glidePose } from './builder/focus.js'
        import { installOpticsPage, OPTICS_CHARTS, chartSet } from './optics/page.js'
        import { installMeasureTool } from './lib/pathtracer/measure/tool.js'
        import { report, reloadFresh, staleFiles } from './diagnose.js'
        import { versionText, loadRevision, stamp } from './version.js'
        import { safeStartOf, started, safeNote, firstCompile } from './start.js'
        import { createProjectStore, indexedDbProjects, memoryProjects } from './workspace/store.js'
        import { createTabs } from './workspace/tabs.js'
        import { createAutosave, recoverAll } from './workspace/autosave.js'
        import { createSession } from './workspace/session.js'
        import { installProjectView, fileName as projectFileName } from './workspace/projectview.js'
        import { ask } from './workspace/ask.js'
        import { createScenePics, indexedDbPics, memoryPics, startCapture } from './workspace/scenepics.js'
        import { createLibrary, indexedDbBackend, memoryBackend } from './library/store.js'
        import { installLibraryPanel } from './library/panel.js'
        import { createThumbs, indexedDbThumbs, memoryThumbs } from './library/thumbs.js'
        import { createStudio } from './library/studio.js'
        import { installItemEditor, SAMPLE_CHOICES, SAMPLE_SIZES, sampleOf, setSample } from './library/edit.js'
        import { ITEM_FILES, itemUrl } from './library/items/index.js'
        import { installTimeline } from './tools/timeline.js'
        import { installHelp } from './help/panel.js'

        //==============================================================================================================
        // DEVICE AND LAYOUT -- the host's job
        //==============================================================================================================
        const U = UTILITY();

        /* STALE FILES, CAUGHT AT START (diagnose.js). A module the browser took from its cache without
           asking the server may be from before an update, and the page then runs old code with new --
           which is how the LED's spot went missing in one Chrome profile and not in an incognito
           window, with nothing said. Checked in the background while the page starts (only files taken
           from the cache unasked are compared, so a server that revalidates costs nothing); if any
           differs from the server's, they are fetched past the cache and the page reloads -- at most
           once a minute, so a server whose files keep changing cannot make it loop. */
        staleFiles().then(stale => {
            if (!stale.length) return;
            console.warn('[stale] the cached copy differs from the server\'s:', stale);
            let last = 0;
            try { last = +sessionStorage.getItem('raytracer.freshReload') || 0; } catch { }
            if (Date.now() - last < 60000) return console.warn('[stale] not reloading again so soon: Help › Reload every file fresh');
            try { sessionStorage.setItem('raytracer.freshReload', String(Date.now())); } catch { }
            reloadFresh(stale);
        }).catch(e => console.warn('[stale] could not check:', e));
        const { CC } = U;
        const WG = WEBGPU();
        WG.defines = defines(TOKENS, SHORT_TOKENS);   // legacy WGSL shorthands used by the kernels
        /* NO `a` AND NO `s` HERE ANY MORE, and that absence is the feature. They used to be
           hardcoded to 1 and 1024, which made ctx.Sc compute a constant 1024x1024 whatever the
           window did. The renderer now owns its own size -- fit the panel, or a size you pick,
           times a downscale. GU still merges the query string over this, so `?s=2048&a=1.7778`
           forces a fixed size exactly as it always did; the difference is that now it only
           means something when it is actually asked for. */
        let Q = U.GU({
            azimuth: 40, elevation: 70, distance: 20, dimensions: 10, fov: 40,
            camtype: 0,
            resetframecount: 1,
        })

        /*=========================================================================================
          THE SHELL: a menu bar, a dock of panels, a status bar (lib/shell). Every part of the
          program is a panel the user can place, stack, float, pop out or close, and the layout
          is kept between visits (UI_PLAN.md). The panels are the pages this page had before,
          unchanged inside: the renderer's settings, the Builder's tree and properties, the
          Optics page and its two charts. Each is labelled with the module it belongs to.

          ORDER MATTERS HERE, three ways:
            - EVERY PANEL IS REGISTERED BEFORE THE LAYOUT IS RESTORED. A saved layout names its
              panels, and one not registered yet is left out of it -- the optics charts would lose
              their place on every reload. So the charts are registered here, long before the
              Optics page that fills them exists.
            - THE LAYOUT IS RESTORED BEFORE THE CANVAS IS MADE. lib/utils.js CC() finds the
              canvas's parent by its id in the document, and a panel's element is only in the
              document once the layout has placed it.
            - THE VIEWPORT IS ALWAYS OPEN: it cannot be closed or popped out (a WebGPU canvas
              belongs to the document that made it), and restore() is followed by open().
        =========================================================================================*/
        /* WHICH BUILD THIS IS (version.js): the version, and the commit the server's checkout is on, read from .git
           before the title is drawn -- two or three small files from the same server; given up after a second */
        await loadRevision();
        document.title = versionText();
        const container = document.getElementById('container');
        const SHELL = createShell(container, {
            title: `${versionText()} © Matthijs Keuper`, storageKey: 'raytracer.layout', popoutUrl: 'popout.html',
            /* FIVE MENUS (0.63.0; the user, 2026-10-17: "Minimise the number of menu options"): no Render settings menu --
               every row of it was the Render settings panel's or the view's Quality ▾ and ⚡ again -- and no Window menu,
               whose verbs are the buttons on every panel group's header (standardCommands({ window: false })). Their
               commands are kept, in the palette (Ctrl K) */
            menus: ['File', 'Edit', 'View', 'Analysis', 'Help'],
        });
        window.SHELL = SHELL;
        /* THE PARAMETERS: every setting by a path -- the renderer's (RT.parameters) and the scene's
           (builder/params.js) -- for the palette, the Parameters panel, a console script, and the
           timeline and optimiser to come (lib/shell/params.js). From the console:
             PARAMS.find('radius'), PARAMS.read(path), PARAMS.write(path, value) */
        const PARAMS = makeParams();
        window.PARAMS = PARAMS;

        /* THE VIEWPORT, the renderer's: the canvas's parent (sized by the renderer's ResizeObserver) and
           the stage the Builder's handles and the measure tool draw on. 'always': it stays in the page
           while another tab covers it, rather than being detached. */
        const stage = SHELL.panel({ id: 'viewport', title: 'Viewport', module: 'renderer', renderer: 'always',
            popout: false, closable: false, help: 'The picture. Click to select, drag the handles to move things, orbit with the mouse.' });
        Object.assign(stage.style, { overflow: 'hidden' });
        const canvasId = 'rt-canvas';
        {
            const canvasHost = document.createElement('div');
            canvasHost.id = canvasId;
            Object.assign(canvasHost.style, { position: 'absolute', inset: '0' });
            stage.appendChild(canvasHost);
        }
        /* THE RENDERER'S SETTINGS, placed by what each changes (UI_PLAN.md section 8), where its six
           pages used to be one panel:
             the view       camera, what it shows, exposure -- the viewport's own toolbar (below, once
                            the renderer exists: lib/pathtracer/viewtools.js)
             the scene      the sun, the sky or the studio: NOT the renderer's any more. The scene
                            document carries it (model.js ENVIRONMENT), and the scene's
                            Properties show it (its own tree row until 0.52.0) -- so the renderer is told to make no folder
             its effort     tracing, render size, diagnostics: Render settings (Renderer until 0.57.0)
             a file         saving an image: a floating panel opened from File
             its bench      Tests
           The renderer fills each with the same folders it used to put on its pages (installUI's
           `sections`); only where they sit is new. */
        /* the tables take the shell's font and colours (shell.css themes Tweakpane inside a panel). `opts` are the
           table's own: `boxes`, its top-level folders drawn as boxes -- by the property table (GUISTUFF), in the
           colours shell.css gives its --pt-box-* properties, so every panel in boxes has the one look */
        const tableIn = (el, opts = {}) => {
            const t = new PropertyTable({ container: el, ...opts });
            Object.assign(t.element.style, { fontSize: '13px', width: '100%' });
            return t;
        };
        /* ...IN BOXES, as the Analysis pane's sections are (the user, 2026-10-04): the renderer's folders are its boxes
           (lib/pathtracer/settingsui.js RENDERER_BOXES) */
        const rendererEl = SHELL.panel({ id: 'renderer', title: 'Render settings', module: 'renderer',
            help: 'How hard the renderer works: Quality (Preview: Sketch, Draft · Accurate: Standard, High · Optics), the light sources and how each is traced, bounces and noise, render size; the developer settings behind their switch.' });
        const rendererTable = tableIn(rendererEl, { boxes: true });
        const testsTable = tableIn(SHELL.panel({ id: 'tests', title: 'Tests', module: 'renderer',
            help: 'The measurement bench: one row per test with a known answer, and a report to copy.' }));
        // no View entry: File › Save picture… opens it, floating (menu: false, lib/shell/shell.js standard)
        const outputTable = tableIn(SHELL.panel({ id: 'output', title: 'Save picture', module: 'renderer', menu: false,
            help: 'Render a picture at a size and sample count of its own, then develop it -- exposure, tone curve, grading, on a preview -- and save it as PNG.' }));
        const statsEl = SHELL.panel({ id: 'stats', title: 'Render stats', module: 'renderer',
            help: 'The renderer\'s live readout: samples per second, cost per sample, the value under the cursor.' });
        /* THE BUILDER, split in two: the project's tree (with its toolbar) and the selection's properties */
        const sceneEl = SHELL.panel({ id: 'scene', title: 'Scene', module: 'builder',
            help: 'The project and its scenes, a card each; under them the scene being worked on: its objects, lights and materials.' });
        /* THE PROJECT PANEL (workspace/projectview.js, 0.63.0): the projects in this browser, this one's scenes large, the
           examples. A dock panel of its own, opened as a tab beside the picture (openProject, below) -- "these will rarely
           have to be viewed side by side" (the user, 2026-10-17). No View row: File › Projects… and the project's name over
           the tree open it */
        const projectEl = SHELL.panel({ id: 'project', title: 'Project', module: 'builder', menu: false,
            help: 'The projects kept in this browser; this one\'s scenes with their pictures; the examples.' });
        const propsEl = SHELL.panel({ id: 'properties', title: 'Properties', module: 'builder',
            help: 'The selected row\'s settings.' });
        /* THE OPTICS: one Analysis pane and a panel per chart (optics/charts.js, mockup F). The pane keeps the
           id 'optics' it had as the Optics panel, so a saved layout still has it. NOT IN VIEW, nor are the charts
           (menu: false): the Analysis menu opens them (the user, 2026-10-10: "remove the chart and analysis views
           from the view menu") -- the pane by its show / hide, a chart by Open chart ▸. */
        const opticsEl = SHELL.panel({ id: 'optics', title: 'Analysis', module: 'optics', menu: false,
            help: 'The optics analysis: ▶ Run, the data every chart is made from, the results; below, the sources, totals and limits. Each chart has its own settings on it.' });
        /* COLOUR MIXING, a tool: it sets the scene's lights' fluxes rather than measuring anything, so it is
           a window of its own (View › Colour mixing floats it), not a folder of the Analysis pane */
        const mixingEl = SHELL.panel({ id: 'tools.mixing', title: 'Colour mixing', module: 'optics',
            help: 'Three of the scene\'s lights, a target colour and a total flux: the fluxes that make it, set in one undo step.' });
        /* THE CHARTS THAT EXIST: one of each kind, and those the user made (another map, its own settings),
           kept between visits -- so registered here, from the kept list, before the layout that names them is
           restored. A chart made later is registered when it is made (charts.add, below). */
        const CHARTS = chartSet({ key: 'raytracer.charts' });
        const chartEls = {};
        const chartPanel = c => (chartEls[c.id] = SHELL.panel({ id: c.id, title: c.title, module: 'optics', menu: false, help: c.help }));
        for (const c of CHARTS.list()) chartPanel(c);
        // in boxes, as Render settings (builder/panel.js show: the selection's, then one a category)
        const propsTable = tableIn(propsEl, { boxes: true });
        /* THE LIBRARY (library/): objects, groups, lights and materials to put in, built in and one's own */
        const libraryEl = SHELL.panel({ id: 'library', title: 'Library', module: 'builder',
            help: 'Things to put into the scene: shapes, modifiers, lights, materials, assemblies, and your own. Double-click one to put it in at the selection; ＋ keeps the selection.' });
        const paramsEl = SHELL.panel({ id: 'parameters', title: 'Parameters', module: 'app',
            help: 'Every setting by the name a script, the timeline or an optimiser uses; its value, its range, and whether changing it recompiles.' });
        /* THE TIMELINE, a tool (tools/timeline.js): keys on the parameters over time, played in the view and
           filmed offscreen. Registered here with the rest, filled once the parameters have their providers. */
        const timelineEl = SHELL.panel({ id: 'tools.timeline', title: 'Timeline', module: 'app', menu: false,
            help: 'Keyframes on any live setting -- the camera, a light\'s flux, an object\'s position -- played in the view, and a video rendered frame by frame (⚙ export, RECORD).' });
        /* THE HELP (help/panel.js): pages to read, with links that open examples, run commands and point at panels.
           Help › Contents and F1 open it, floating; View lists it too. Filled once the commands exist (below). */
        const helpEl = SHELL.panel({ id: 'help', title: 'Help', module: 'app', menu: false,
            help: 'How to use ShadyTracer: getting started, modelling and rendering, optical design, and a reference of every shape, modifier, material field and light setting.' });

        /* THE LAYOUTS: one per stage of the work, in the menu bar's switcher and the View menu. Each is
           where to start; what the user changes from there is kept between visits. Design is also the
           default, what View > Reset the layout returns to. The charts are Analyse's: the Analysis pane
           on the left, the charts beside it in two rows -- the map, polar and I-gamma over the profiles,
           rings and encircled flux -- and the picture a tab behind the map. */
        const O = (id, at, size, opts) => SHELL.open(id, at, size, opts);
        const DESIGN = () => {
            O('viewport');
            O('scene', { referencePanel: 'viewport', direction: 'left' }, { width: 320 });
            O('properties', { referencePanel: 'scene', direction: 'below' });
            O('library', { referencePanel: 'scene', direction: 'within' });
            O('scene');
            O('renderer', { referencePanel: 'viewport', direction: 'right' }, { width: 330 });
            O('optics', { referencePanel: 'renderer', direction: 'within' });
            O('stats', { referencePanel: 'renderer', direction: 'below' }, { height: 220 });
            O('renderer');
        };
        SHELL.layout.setDefault(DESIGN);
        SHELL.layout.preset('Design', DESIGN, 'Build the scene: the tree and the selection\'s properties beside the picture.');
        SHELL.layout.preset('Analyse', () => {
            O('viewport');
            O('optics', { referencePanel: 'viewport', direction: 'left' }, { width: 330 });
            O('optics.map', { referencePanel: 'viewport', direction: 'within' });
            O('optics.polar', { referencePanel: 'optics.map', direction: 'right' }, { width: Math.round((innerWidth - 330) / 3) });
            O('optics.igamma', { referencePanel: 'optics.polar', direction: 'right' }, { width: Math.round((innerWidth - 330) / 3) });
            O('optics.profiles', { referencePanel: 'optics.map', direction: 'below' });
            O('optics.rings', { referencePanel: 'optics.polar', direction: 'below' });
            O('optics.encircled', { referencePanel: 'optics.igamma', direction: 'below' });
            O('optics.map');
        }, 'Measure and decide: the Analysis pane beside every chart, each in a panel of its own; the picture behind the map.');
        /* ANIMATE: the timeline across the whole foot of the window, under the picture and the tree -- opened
           before the tree, so the tree splits the top row and not the timeline's. Properties and Parameters
           beside the tree: a key holds a setting's current value, so the place it is set is where a key starts. */
        SHELL.layout.preset('Animate', () => {
            O('viewport');
            O('tools.timeline', { referencePanel: 'viewport', direction: 'below' }, { height: Math.round(innerHeight * 0.34) });
            O('scene', { referencePanel: 'viewport', direction: 'left' }, { width: 300 });
            O('properties', { referencePanel: 'scene', direction: 'below' });
            O('parameters', { referencePanel: 'properties', direction: 'within' });
            O('properties');
        }, 'Animate and film: the timeline along the bottom, the picture above it, the tree and a setting\'s properties beside.');
        /* NO RENDER LAYOUT (it was the picture, the renderer and the stats): Design with the Analysis pane hidden
           (Analysis › Analysis setup) is the same arrangement, so it was a second name for one thing (the user,
           2026-10-10). A saved arrangement is kept by its panels, not by a preset's name (lib/shell/shell.js
           restore), so nothing saved named it. */
        /* whatever a layout holds, the picture is in it: nothing else can make the canvas. Only when it is
           missing: open() on an open panel brings it to the front, which put the picture over the map
           Analyse had just chosen to show */
        SHELL.layout.onApply(() => { if (!SHELL.isOpen('viewport')) SHELL.open('viewport'); });
        /* VIEW OPENS THE PANELS, and nothing else does (the user, 2026-10-09: "lots of duplicate entries" -- Render,
           Optics, Tools and Edit each had an entry that opened a panel View already listed). Two panels open their own
           way, so their View entries are the page's, registered before the shell's (which keeps an entry it finds):
           the colour mixing floats, a tool beside the work; the timeline goes across the foot of the view. */
        /* the colour mixing is an optics tool, so it is the Analysis menu's with the pane and the charts; its id stays
           `view.<panel id>`, which is what keeps the shell from adding a View entry of its own */
        SHELL.command({ id: 'view.tools.mixing', menu: 'Analysis', group: 'tools', label: 'Colour mixing',
            help: 'Three of the scene\'s lights, a target colour and a total flux: the fluxes that make it',
            run: () => SHELL.isOpen('tools.mixing') ? SHELL.open('tools.mixing')
                : SHELL.open('tools.mixing', undefined, undefined, { floating: { width: 380, height: 480 } }) });
        /* THE HELP floats over the work, a page to read beside it. Help › Contents and F1 open it (registered with the help,
           below); View said it again until 0.63.0 -- its id is kept, with no menu row, so the shell adds none */
        const openHelp = () => SHELL.isOpen('help') ? SHELL.open('help')
            : SHELL.open('help', undefined, undefined, { floating: { width: Math.min(900, innerWidth - 80), height: Math.min(680, innerHeight - 80) } });
        SHELL.command({ id: 'view.help', label: 'Help: the help pages', help: 'The help pages (Help › Contents, F1)', run: openHelp });
        /* THE WINDOW VERBS AND "LAYOUT: X" IN NO MENU (0.63.0): the first are the buttons on every group's header, the second
           the layout buttons on the menu bar; the palette keeps both */
        SHELL.standardCommands({ window: false, layouts: false });
        /* THE TIMELINE goes across the foot of the view: its View entry is the page's (the panel has none of the shell's,
           menu: false), registered after the shell's so it comes after Parameters, among the app's panels */
        SHELL.command({ id: 'view.tools.timeline', menu: 'View', group: 'panels.app', label: 'Timeline',
            help: 'Keyframes on any live setting, played in the view, and a video rendered frame by frame',
            run: () => SHELL.isOpen('tools.timeline') ? SHELL.open('tools.timeline')
                : SHELL.open('tools.timeline', { referencePanel: 'viewport', direction: 'below' }, { height: Math.round(innerHeight * 0.34) }) });
        SHELL.layout.restore();
        SHELL.open('viewport');

        let ctx = CC(canvasId, "webgpu", 0, {})
        // no ctx.Sc(Q) -- createPathTracer sizes itself from the panel before it builds the
        // camera, and keeps doing so from a ResizeObserver
        // timestamp-query is best-effort: tinywebgpu drops a feature the adapter lacks with a
        // warning rather than throwing, and the cost instrument falls back to wall-clock timing.
        await WG.init(ctx, { features: ['timestamp-query'] })

        //==============================================================================================================
        // THE RENDERER
        //==============================================================================================================
        /* THE PROJECT: THE ONE KEPT IN THIS BROWSER (workspace/, UI_PLAN.md section 10) -- the one worked on last, as it
           was left: its scenes, the scene being worked on, the renderer's settings, every scene's camera, a library
           item being edited. Until 0.7.0 every load put the nine bundled scenes into a fresh project and restored
           nothing, so a refresh lost the work. A first visit gets a project of one lightweight demo scene
           (scenes/index.js FIRST_VISIT); the bundled scenes are the Project panel's examples. A second tab on the project
           another has works on its own copy (workspace/session.js); a project that cannot be read is kept as it was
           and a fresh one started. A browser that refuses storage keeps the work for the visit, and says so.
           The renderer starts on the scene being worked on, generated here the same way BUILDER.apply generates it
           -- id 'built', which is how the builder knows the scene showing is one of its own. */
        const readScene = async file => Model.ensureMaterial(Model.parse(await (await fetch(urlOf(file))).text()))
        let localStore = null;
        try { localStore = window.localStorage; } catch { }
        let projectBackend = indexedDbProjects(), storeNote = null;
        try { await projectBackend.all('meta'); }
        catch (e) {
            console.warn('[projects] IndexedDB refused, the work lasts this visit:', e?.message);
            projectBackend = memoryProjects();
            storeNote = 'this browser refused storage: the work lasts this visit (File › Export ▸ Project file keeps it)';
        }
        const PROJECTS = createProjectStore({ backend: projectBackend });
        /* THE SCENES' PICTURES (workspace/scenepics.js, 0.63.0): the last picture each scene had, and how long it took to open,
           for its card -- a database of their own, or memory where the browser refuses storage */
        const PICS = window.PICS = createScenePics({ backend: storeNote ? memoryPics() : indexedDbPics() });
        let showProject = async () => { };            // the page's, once the builder exists (below)
        /* WHAT IS SAVED, looked at once a second (workspace/autosave.js): the builder's revision and scenes, and the
